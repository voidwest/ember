[package]
name = "ember"
version = "0.6.6"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[dependencies]
tokenizers = "0.20"
thiserror = "1"
anyhow = "1"
memmap2 = "0.9"
libm = "0.2.16"
half = "2.7.1"
matrixmultiply = "0.3.10"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
# NOTE: do not chase a single rand version: gpui's transitive tree pulls
# rand 0.9/0.10 (ashpd/oo7), and num-bigint-dig (also via gpui) needs 0.8,
# so 0.8 here costs nothing extra and matches the sampling API.
rayon = "1"
rtrb = "0.3"  # lock-free SPSC rings for the duplex audio queues (pure rust)
tiny_http = "0.12"
# v0.6 native console: gpui (Zed's GPU-accelerated framework, blade/Vulkan on
# Linux). Optional (feature "gui", on by default): headless research builds
# use --no-default-features and skip the blade/ash/wayland stack. Embedded
# Noto fonts (src/gui_fonts/) provide Latin + Arabic coverage offline.
gpui = { version = "0.2.2", default-features = true, optional = true }
unicode-segmentation = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Phase 5 Track A: live audio I/O. Opt-in because it links libasound at
# build time (absent on some CI/hermetic hosts); everything else about the
# duplex runtime (queues, VAD, policies) is pure Rust and always compiled.
# cpal reaches PipeWire/JACK through their ALSA compat layers and gives a
# direct CoreAudio path for a future macOS port.
cpal = { version = "0.15", optional = true }

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:unicode-segmentation"]
audio = ["dep:cpal"]

# Cross-crate inlining for the CLI binary without full fat-LTO build cost.
# (codegen-units stays at the default; measure 1-unit builds on a cool
# machine before committing to them.)
[profile.release]
lto = "thin"

[[bench]]
name = "q8_matmul"
harness = false

[[bench]]
name = "hooks_overhead"
harness = false

[[bench]]
name = "k_quant_matmul"
harness = false

[[bench]]
name = "multimodal_batch"
harness = false

# Mirror CI's clippy posture so local `cargo clippy` matches `cargo clippy
# --all-targets --all-features -- -D warnings` on GitHub Actions.
[lints.clippy]
all = "warn"

[dev-dependencies]
proptest = "1.11"
