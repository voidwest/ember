[package]
name = "ember"
version = "0.5.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[dependencies]
tokenizers = "0.20"
thiserror = "1"
anyhow = "1"
memmap2 = "0.9"
libm = "0.2.16"
half = "2.7.1"
matrixmultiply = "0.3.10"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
unicode-normalization = "0.1"

[[bench]]
name = "q8_matmul"
harness = false

# Mirror CI's clippy posture so local `cargo clippy` matches `cargo clippy
# --all-targets --all-features -- -D warnings` on GitHub Actions.
[lints.clippy]
all = "warn"
