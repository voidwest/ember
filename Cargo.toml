[package]
name = "ember"
version = "0.6.2"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[dependencies]
tokenizers = "0.20"
thiserror = "1"
anyhow = "1"
memmap2 = "0.9"
libm = "0.2.16"
half = "2.7.1"
matrixmultiply = "0.3.10"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
rayon = "1"
tiny_http = "0.12"
# v0.6 native console: gpui (Zed's GPU-accelerated framework, blade/Vulkan on
# Linux). Optional (feature "gui", on by default): headless research builds
# use --no-default-features and skip the blade/ash/wayland stack. Embedded
# Noto fonts (src/gui_fonts/) provide Latin + Arabic coverage offline.
gpui = { version = "0.2.2", default-features = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
unicode-normalization = "0.1"

[features]
default = ["gui"]
gui = ["dep:gpui"]

[[bench]]
name = "q8_matmul"
harness = false

[[bench]]
name = "hooks_overhead"
harness = false

[[bench]]
name = "k_quant_matmul"
harness = false

# Mirror CI's clippy posture so local `cargo clippy` matches `cargo clippy
# --all-targets --all-features -- -D warnings` on GitHub Actions.
[lints.clippy]
all = "warn"

[dev-dependencies]
proptest = "1.11"
