[package]
name = "ember"
version = "0.6.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[dependencies]
tokenizers = "0.20"
thiserror = "1"
anyhow = "1"
memmap2 = "0.9"
libm = "0.2.16"
half = "2.7.1"
matrixmultiply = "0.3.10"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
rayon = "1"
tiny_http = "0.12"
# v0.6 native console: software-rendered iced app (no GPU/webview dependency).
# Embedded Noto fonts (src/gui_fonts/) provide Latin + Arabic coverage offline.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "highlighter", "x11", "wayland", "tokio", "web-colors", "crisp", "thread-pool"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
unicode-normalization = "0.1"

[[bench]]
name = "q8_matmul"
harness = false

[[bench]]
name = "hooks_overhead"
harness = false

# Mirror CI's clippy posture so local `cargo clippy` matches `cargo clippy
# --all-targets --all-features -- -D warnings` on GitHub Actions.
[lints.clippy]
all = "warn"

[dev-dependencies]
proptest = "1.11"
