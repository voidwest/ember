[workspace]
# Optional PyO3 layer; never built by root cargo commands (default-members)
# and never required for the CLI/headless install path.
members = ["bindings/python"]
default-members = ["."]
# Standalone nested projects that predate this workspace and must keep their
# own toolchains/lockfiles (fuzz is a cargo-fuzz project on a pinned nightly;
# the others are frozen artifacts). Without this they resolve the root
# workspace and refuse to build.
exclude = [
    "fuzz",
    "docs/embersec/phase5-correction-2026-09-03/sweep",
    "research/embersec/comparative/reference/candle",
]

[package]
name = "ember"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "CPU-first Rust inference and hidden-state research layer for GGUF models"
repository = "https://github.com/voidwest/ember"
homepage = "https://voidwest.dev/ember"
readme = "README.md"
keywords = ["gguf", "llm", "inference", "interpretability", "research"]
categories = ["command-line-utilities", "science"]

[dependencies]
# Only what Ember uses: loading tokenizer.json, encode/decode, and the
# pre-tokenizer/normalizer regexes (`onig`, the default regex engine, kept so
# encodings stay byte-identical). The default `progressbar` (indicatif ->
# unmaintained number_prefix) and `esaxx_fast` (C++ suffix arrays for Unigram
# *training*) features are not needed.
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
thiserror = "1"
anyhow = "1"
memmap2 = "0.9"
libm = "0.2.16"
half = "2.7.1"
matrixmultiply = "0.3.10"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
# NOTE: do not chase a single rand version: gpui's transitive tree pulls
# rand 0.9/0.10 (ashpd/oo7), and num-bigint-dig (also via gpui) needs 0.8,
# so 0.8 here costs nothing extra and matches the sampling API.
rayon = "1"
rtrb = "0.3"  # lock-free SPSC rings for the duplex audio queues (pure rust)
tiny_http = "0.12"
# Minimal cross-platform Ctrl-C handling for cooperative cancellation
# (src/cancel.rs + cli_support::install_sigint_cancel).
ctrlc = "3"
# GPUI Kit console. Optional so headless builds retain Rust 1.92 support.
# GUI builds use the pinned Rust 1.98.1 development toolchain. Embedded Noto
# fonts provide offline Latin and Arabic coverage.
gpui-kit = { version = "=0.6.6", optional = true }
serde = { version = "1", features = ["derive"] }
# Preserve original key order when verifying legacy 0.5/0.6 bundle hashes.
# New deterministic payloads sort explicitly, including in headless builds.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
sha2 = "0.10"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Phase 5 Track A: live audio I/O. Opt-in because it links libasound at
# build time (absent on some CI/hermetic hosts); everything else about the
# duplex runtime (queues, VAD, policies) is pure Rust and always compiled.
# cpal reaches PipeWire/JACK through their ALSA compat layers and gives a
# direct CoreAudio path for a future macOS port.
cpal = { version = "0.15", optional = true }
ed25519-dalek = "2"

[features]
default = ["gui"]
gui = ["dep:gpui-kit"]
# Opt-in headless UI interaction tests; ordinary headless builds stay lightweight.
gui-tests = ["gui", "gpui-kit/test-support"]
audio = ["dep:cpal"]

# Cross-crate inlining for the CLI binary without full fat-LTO build cost.
# (codegen-units stays at the default; measure 1-unit builds on a cool
# machine before committing to them.)
[profile.release]
lto = "thin"

[[bench]]
name = "q8_matmul"
harness = false

[[bench]]
name = "hooks_overhead"
harness = false

[[bench]]
name = "k_quant_matmul"
harness = false

[[bench]]
name = "agent_overhead"
harness = false

[[bench]]
name = "multimodal_batch"
harness = false

# Mirror CI's clippy posture so local `cargo clippy` matches `cargo clippy
# --all-targets --all-features -- -D warnings` on GitHub Actions.
[lints.clippy]
all = "warn"

[dev-dependencies]
# Compress historical metadata without changing the frozen bundle bytes.
flate2 = "1.1.9"
proptest = "1.11"

# Hardware SHA-256 on aarch64 (ARMv8 SHA2 instructions, runtime-detected with
# a software fallback). Model pins are checked by hashing the whole GGUF on
# every run; the software path spent ~3 s per 1.3 GB model on an M1, the
# hardware one ~0.6 s. x86_64 already selects SHA-NI at runtime.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
