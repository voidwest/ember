name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: audit
        run: cargo audit

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: select Rust toolchain
        # rust-toolchain.toml pins the toolchain (1.92.0 = Cargo.toml
        # rust-version); install it here so the runner has it.
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: install X11 system libraries (gpui native GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: build
        run: cargo build --locked --release --all-targets --verbose

      - name: test
        run: cargo test --locked --all-targets --verbose

      - name: canonical K-quant x86 tier (fail closed)
        env:
          EMBER_REQUIRE_X86_TESTS: "1"
          RAYON_NUM_THREADS: "2"
        run: cargo test --locked --release --lib k_quant_matmul::tests -- --nocapture

      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: fmt
        run: cargo fmt --all -- --check

      - name: docs
        # rustdoc lints (broken_intra_doc_links, private_intra_doc_links) are
        # warn-level in lib.rs; -D warnings turns any regression into a red
        # CI run.
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --release

      - name: python dependencies
        run: python -m pip install -r probes/requirements.txt

      - name: python smoke
        run: |
          python -m compileall -q python probes stimuli scripts tests
          python probes/run_probe_matrix.py --model smoke:dummy.gguf --generate-tokens 1 --dry-run
          bash -n bench_compare.sh probes/run_all_5k.sh scripts/research_example_capture_patch.sh scripts/conference_demo.sh scripts/validate_k_parity.sh tools/crossover_sweep.sh tools/verify_k_quant_llamacpp.sh

      - name: python tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests probes/test_probe_workflows.py -q
          python scripts/check_docs.py
