name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# A newer push supersedes an older run on the same ref; without this, runs
# that cannot get a runner pile up in the queue until GitHub cancels them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prebuilt pinned cargo-audit binary (rustsec publishes release
      # binaries). Source-compiling current cargo-audit breaks: its newest
      # dependencies require Rust 1.96 while this repo pins 1.92.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: audit
        run: cargo audit

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: select Rust toolchain
        # Install the pinned development/GUI toolchain. Headless MSRV is checked below.
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: install X11 system libraries (gpui native GUI)
        run: |
          sudo apt-get update
          # libasound2-dev: the `audio` feature (cpal -> alsa-sys) needs the
          # ALSA headers; only `clippy --all-features` compiles it, but a
          # missing header fails that step (v0.6.6 first run).
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libwayland-dev libasound2-dev pkg-config

      - name: build
        run: cargo build --locked --release --all-targets --verbose

      - name: test
        run: cargo test --locked --all-targets --verbose

      - name: doctests
        # --all-targets does not include doctests.
        run: cargo test --locked --doc

      - name: test with the audio feature
        # Otherwise only clippy ever compiles `audio`; libasound2-dev is
        # installed above.
        run: cargo test --locked --features audio --lib

      - name: native GUI interactions (headless test window)
        run: cargo test --locked --features gui-tests --bin ember gui_native::kit_tests

      - name: canonical K-quant x86 tier (fail closed)
        env:
          EMBER_REQUIRE_X86_TESTS: "1"
          RAYON_NUM_THREADS: "2"
        run: |
          # The AVX-512 kernels are checked against AVX2 whenever the runner
          # has AVX-512; hosted runners vary, so say which case this run hit.
          if grep -qw avx512bw /proc/cpuinfo; then echo "AVX-512 present: AVX-512 K kernels are tested"; else echo "no AVX-512 on this runner: AVX-512 K kernels not exercised"; fi
          cargo test --locked --release --lib k_quant_matmul::tests -- --nocapture

      - name: headless check on the MSRV (no gui feature)
        # `+1.92.0` overrides rust-toolchain.toml, so this is the x86_64
        # counterpart of the arm64 job's MSRV check rather than another 1.98.1
        # build.
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          cargo +1.92.0 check --locked --no-default-features --all-targets

      - name: clippy
        # New 1.98 style lint: retain measured kernel loop shapes during the
        # GUI migration. Rewriting them belongs in a separate benchmarked change.
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -A clippy::chunks_exact_to_as_chunks

      - name: clippy (python bindings)
        # Same 1.98 style-lint exception as the main clippy step above: the
        # binding build lints the `ember` lib, whose measured kernel loops are
        # intentionally retained during the GUI migration.
        run: cargo clippy --locked -p ember-python -- -D warnings -A clippy::chunks_exact_to_as_chunks

      - name: fmt
        run: cargo fmt --all -- --check

      - name: docs
        # rustdoc lints (broken_intra_doc_links, private_intra_doc_links) are
        # warn-level in lib.rs; -D warnings turns any regression into a red
        # CI run.
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --release

      - name: python dependencies
        run: python -m pip install -r probes/requirements.txt

      - name: python smoke
        run: |
          python -m compileall -q python probes stimuli scripts tests
          python probes/run_probe_matrix.py --model smoke:dummy.gguf --generate-tokens 1 --dry-run
          bash -n bench_compare.sh probes/run_all_5k.sh scripts/research_example_capture_patch.sh scripts/conference_demo.sh scripts/validate_k_parity.sh tools/crossover_sweep.sh tools/verify_k_quant_llamacpp.sh

      - name: python bindings
        # Optional PyO3 layer over the same core. The binding tests
        # importorskip without a build; install it so CI exercises them.
        run: python -m pip install ./bindings/python

      - name: python tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests probes/test_probe_workflows.py -q
          python scripts/check_docs.py

  build-and-test-arm64:
    # aarch64 tier: validates the NEON kernels and the headless (no-gui)
    # build surface. Headless because the gpui/X11 stack is only exercised
    # on x86_64 above; the K-quant x86 dot kernels are cfg'd out here.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: select Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.92.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: build (headless)
        run: cargo build --locked --no-default-features --all-targets

      - name: test (headless)
        run: cargo test --locked --no-default-features --all-targets

      - name: clippy (headless)
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

  build-and-test-macos:
    # macOS is the advertised Metal GUI platform (README, docs/usage.md) and
    # the primary development host, yet no job here built it: every numeric
    # claim in docs/validation.md came from a platform CI never compiled.
    #
    # Both architectures are covered deliberately. Together with the x86_64
    # and arm64 Linux jobs this completes the 2x2 the support matrix claims.
    # macos-latest is arm64; macos-15-intel is the x86_64 (Intel) image.
    # macos-13 was retired and its jobs sat queued until GitHub cancelled
    # them, which left every run since 2026-09-28 unfinished. If GitHub
    # retires this label too, replace it rather than dropping Intel-macOS
    # coverage silently.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: arm64
          - runner: macos-15-intel
            label: x86_64
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # No explicit toolchain install: rust-toolchain.toml pins 1.98.1, which
      # is what the GUI features need. The Linux jobs install a *different*
      # version on purpose (1.92.0 on arm64 to prove the headless MSRV), so
      # they cannot be copied here.
      - name: report toolchain
        run: |
          rustc --version
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.label }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.label }}-cargo-

      - name: build (headless)
        run: cargo build --locked --no-default-features --all-targets

      - name: test (headless)
        run: cargo test --locked --no-default-features --all-targets

      - name: clippy (headless)
        # The same 1.98 chunks_exact carve-out as the x86_64 job: it is a new
        # style lint, and the measured kernel loop shapes are intentionally
        # retained. Omitting it here would fail on 1.98.1.
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings -A clippy::chunks_exact_to_as_chunks

      - name: gui compile check (Metal)
        # Compile-only: this proves the GPUI Kit/Metal stack builds on macOS
        # for this architecture. It does NOT prove the console renders or is
        # usable -- that stays a manual acceptance item in
        # docs/road-to-1.0.md section 1. The gui-tests headless window needs a
        # display and is therefore not run here.
        run: cargo check --locked --features gui --all-targets

  golden-path:
    # The README's five-minute workflow on the pinned model, end to end:
    # capture, verify, intervene, restore bit-exactly, reproduce. Every other
    # job runs without a model, so without this nothing in CI exercises a
    # real forward pass on the path the project calls golden.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-golden-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-golden-cargo-

      - name: cache the pinned model
        # Keyed by the model's pinned SHA-256; download_models.sh re-checks it.
        uses: actions/cache@v4
        with:
          path: Llama-3.2-1B-Instruct-Q8_0.gguf
          key: model-llama-3.2-1b-q8_0-432f310a77f4650a88d0fd59ecdd7cebed8d684bafea53cbff0473542964f0c3

      - name: fetch the pinned model
        run: scripts/download_models.sh research-example

      - name: build (headless release)
        run: cargo build --locked --release --no-default-features --bin ember

      - name: golden-path acceptance
        run: python scripts/validate_morphology_example.py --workdir "$RUNNER_TEMP/golden-path"

      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-path-evidence
          path: ${{ runner.temp }}/golden-path
          if-no-files-found: ignore
