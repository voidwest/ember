name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: select Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.92.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: build
        run: cargo build --locked --release --all-targets --verbose

      - name: test
        run: cargo test --locked --all-targets --verbose

      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: fmt
        run: cargo fmt --all -- --check

      - name: python dependencies
        run: python -m pip install -r probes/requirements.txt

      - name: python smoke
        run: |
          python -m compileall -q src probes stimuli scripts tests
          python probes/run_probe_matrix.py --model smoke:dummy.gguf --generate-tokens 1 --dry-run
          bash -n bench_compare.sh probes/run_all_5k.sh scripts/research_example_capture_patch.sh tools/crossover_sweep.sh

      - name: python tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests probes/test_probe_workflows.py -q
          python scripts/check_docs.py
