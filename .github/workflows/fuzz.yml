name: parser-fuzz

# Short libFuzzer smoke campaigns for the model-free hostile-input boundaries.
# Longer campaigns are run locally or on dedicated fuzzing infrastructure.

# Fuzz targets execute repository-controlled code; keep the job token
# read-only even for same-repository pull requests.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "fuzz/**"
      - "crates/ember-core/src/loader.rs"
      - "src/npy.rs"
      - "src/kv_snapshot.rs"
      - "crates/ember-core/src/tokenizer.rs"
      - "crates/ember-core/src/llama.rs"
      - "crates/ember-core/src/model.rs"
      - "crates/ember-core/src/gemma4.rs"
      - "crates/ember-core/src/tensor.rs"
      - "crates/ember-core/src/quant.rs"
      - "crates/ember-core/src/quant_k.rs"
      - "crates/ember-core/src/simd.rs"
      - "src/multimodal/**"
      - "crates/ember-core/src/plan.rs"
      - "crates/ember-core/src/plan_build.rs"
      - "crates/ember-core/src/k_quant_matmul.rs"
      - "crates/ember-core/src/k_quant_matmul/**"
      - "crates/ember-core/src/half_weight.rs"
      - "crates/ember-core/src/packed_cache.rs"
      - "Cargo.toml"
      - "crates/ember-core/Cargo.toml"
      - "crates/ember-core/build.rs"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/run_parser_fuzz.sh"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches: [main]
    paths:
      - "fuzz/**"
      - "crates/ember-core/src/loader.rs"
      - "src/npy.rs"
      - "src/kv_snapshot.rs"
      - "crates/ember-core/src/tokenizer.rs"
      - "crates/ember-core/src/llama.rs"
      - "crates/ember-core/src/model.rs"
      - "crates/ember-core/src/gemma4.rs"
      - "crates/ember-core/src/tensor.rs"
      - "crates/ember-core/src/quant.rs"
      - "crates/ember-core/src/quant_k.rs"
      - "crates/ember-core/src/simd.rs"
      - "src/multimodal/**"
      - "crates/ember-core/src/plan.rs"
      - "crates/ember-core/src/plan_build.rs"
      - "crates/ember-core/src/k_quant_matmul.rs"
      - "crates/ember-core/src/k_quant_matmul/**"
      - "crates/ember-core/src/half_weight.rs"
      - "crates/ember-core/src/packed_cache.rs"
      - "Cargo.toml"
      - "crates/ember-core/Cargo.toml"
      - "crates/ember-core/build.rs"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/run_parser_fuzz.sh"
      - ".github/workflows/fuzz.yml"
  # The path filters cannot list every module the loader reaches; a weekly
  # run catches regressions that arrive through an unlisted file.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # Pin compiler and driver; the runner script checks locked resolution.
  FUZZ_TOOLCHAIN: nightly-2026-05-26

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # Compiling ember + deps with libFuzzer instrumentation on a cold runner
    # takes 20-40 min; 30 min was repeatedly exceeded (job cancelled at the
    # limit with zero campaigns run). 90 min covers cold builds with margin
    # while still failing loudly on genuinely stuck campaigns.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: install nightly and resolve host target
        id: fuzz_target
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          triple=$(rustc "+$FUZZ_TOOLCHAIN" -vV | sed -n 's/^host: //p')
          test -n "$triple"
          echo "triple=$triple" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-${{ runner.arch }}-fuzz-${{ env.FUZZ_TOOLCHAIN }}-${{ steps.fuzz_target.outputs.triple }}-address-0.13.2-v1-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'scripts/run_parser_fuzz.sh') }}

      - name: install cargo-fuzz
        run: cargo "+$FUZZ_TOOLCHAIN" install cargo-fuzz@0.13.2 --locked

      - name: type-check, build once, and run bounded parser campaigns
        env:
          FUZZ_TARGET_TRIPLE: ${{ steps.fuzz_target.outputs.triple }}
        run: bash scripts/run_parser_fuzz.sh

      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parser-fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
