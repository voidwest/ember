[[interventions]]
id = "patch-spain"
site = "attention-heads"
layers = [0]
inputs = ["spain"]
operation = { kind = "replace" }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-heads", input_id = "spain", layer = 0 }

[interventions.tokens]
kind = "prompt-final"

[output]
directory = "runs/capital-head-patching-sweep"
overwrite = false

[sweep]
layers = [8, 9]
heads = "all"
move_bundle_sources = true

[sweep.effect]
capture = "answer"

[[sweep.effect.targets]]
input = "france"
target = " Paris"
foil = " Rome"

