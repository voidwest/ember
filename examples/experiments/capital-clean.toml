# The clean side of a patching study: eight capital prompts, with the
# residual stream entering every block at the final token. The patching
# sweep reads these rows (capital-patching-sweep.toml).
#
#   ember experiment run examples/experiments/capital-clean.toml
#   ember experiment run examples/experiments/capital-patching-sweep.toml

schema = "ember.experiment.v1"

[experiment]
name = "capital-clean"
description = "Clean capital prompts; final-token residual stream at every layer."

[model]
path = "Llama-3.2-1B-Instruct-Q8_0.gguf"
expected_sha256 = "432f310a77f4650a88d0fd59ecdd7cebed8d684bafea53cbff0473542964f0c3"
tokenizer = "tokenizer.json"
tokenizer_expected_sha256 = "6b9e4e7fb171f92fd137b777cc2714bf87d11576700a1dcd7a399e7bbe39537b"

[execution]
mode = "reference"
threads = 4
deterministic = true

[generation]
max_new_tokens = 0
temperature = 0.0

[[inputs]]
id = "france"
text = "The capital of France is the city of"

[[inputs]]
id = "germany"
text = "The capital of Germany is the city of"

[[inputs]]
id = "japan"
text = "The capital of Japan is the city of"

[[inputs]]
id = "egypt"
text = "The capital of Egypt is the city of"

[[inputs]]
id = "poland"
text = "The capital of Poland is the city of"

[[inputs]]
id = "portugal"
text = "The capital of Portugal is the city of"

[[inputs]]
id = "italy"
text = "The capital of Italy is the city of"

[[inputs]]
id = "spain"
text = "The capital of Spain is the city of"

[[captures]]
id = "final-residual"
site = "residual-pre-attention"
layers = "all"

[captures.tokens]
kind = "prompt-final"

[output]
directory = "runs/capital-clean"
overwrite = false
