# Patch one SAE feature at a time: for each corrupted capital prompt, set
# the one country feature that the clean prompt has (from
# capital-feature-capture.toml) to its value in the clean run, at the input
# of block 10, final token. Nothing else in the row changes: the edit adds
# only the feature's decoded change. The source rows are the clean run's
# residual stream (runs/capital-clean, from capital-clean.toml; run it first),
# which Ember encodes with the same dictionary.
#
# The dictionary is a sparse autoencoder for Llama-3.2-1B-Instruct, trained
# on the output of block 9 (Apache-2.0, 32,768 features). That output is the
# input of block 10, so it is bound to residual-pre-attention layer 10. It is
# a PyTorch state dict, not a SAELens folder; convert it once:
#
#   curl -L -o qresearch-l9.pt https://huggingface.co/qresearch/Llama-3.2-1B-Instruct-SAE-l9/resolve/4fd505efade04b357f98666f69bae5fd718c039c/Llama-3.2-1B-Instruct-SAE-l9.pt
#   # sha256 d89b1b4953379a824f1e4a31599ac42c66eb8dc3382b7d960dce67d97ebc7ace
#   python scripts/convert_linear_sae.py qresearch-l9.pt \
#       dictionaries/qresearch-llama-3.2-1b-instruct-sae-l9 \
#       --model-name meta-llama/Llama-3.2-1B-Instruct \
#       --hook-name blocks.9.hook_resid_post \
#       --source "huggingface.co/qresearch/Llama-3.2-1B-Instruct-SAE-l9@4fd505efade04b357f98666f69bae5fd718c039c" \
#       --license apache-2.0
#
# The two hashes below are the converter's output for that file. On the
# clean prompts the fit is a mean l0 of 46 active features and a median
# relative reconstruction error of 0.48.
#
# Result on the pinned model (Apple M1 Pro, reference mode, 2026-10-22; one
# deterministic run), for logit(clean capital) - logit(corrupted capital):
#
#   patched                         mean effect   95% interval     +/-/0
#   the one country feature         +3.39         [2.37, 4.53]     8/0/0
#   the top 3 / 10 / 30 features    +3.70 / +3.85 / +3.91           8/0/0
#   all 32,768 features             +5.65         [4.74, 6.96]     8/0/0
#   the raw residual row            +9.80         [8.77, 10.92]    8/0/0
#
# One feature recovers 60% of what the whole dictionary can recover. The
# whole dictionary recovers less than the raw row, because the
# reconstruction error (about 46% of the row's norm) stays from the corrupted
# run. The feature is sufficient but not necessary: zeroing it in the clean
# prompts (operation = { kind = "zero" } on the clean inputs) lowers the
# margin by only 0.74 of 9.83 (7 of 8 prompts, sign test p = 0.07).
#
#   ember experiment run examples/experiments/capital-clean.toml
#   ember experiment run examples/experiments/capital-feature-patching-sweep.toml

schema = "ember.experiment.v1"

[experiment]
name = "capital-feature-patching-sweep"
description = "Patch the one clean country feature into each corrupted capital prompt, entering block 10."

[model]
path = "Llama-3.2-1B-Instruct-Q8_0.gguf"
expected_sha256 = "432f310a77f4650a88d0fd59ecdd7cebed8d684bafea53cbff0473542964f0c3"
tokenizer = "tokenizer.json"
tokenizer_expected_sha256 = "6b9e4e7fb171f92fd137b777cc2714bf87d11576700a1dcd7a399e7bbe39537b"

[execution]
mode = "reference"
threads = 4
deterministic = true

[generation]
max_new_tokens = 0
temperature = 0.0

[[inputs]]
id = "france"
text = "The capital of Italy is the city of"

[[inputs]]
id = "germany"
text = "The capital of Spain is the city of"

[[inputs]]
id = "japan"
text = "The capital of Russia is the city of"

[[inputs]]
id = "egypt"
text = "The capital of Greece is the city of"

[[inputs]]
id = "poland"
text = "The capital of Austria is the city of"

[[inputs]]
id = "portugal"
text = "The capital of Sweden is the city of"

[[inputs]]
id = "italy"
text = "The capital of France is the city of"

[[inputs]]
id = "spain"
text = "The capital of Germany is the city of"

[[dictionaries]]
id = "l10"
path = "dictionaries/qresearch-llama-3.2-1b-instruct-sae-l9"
sha256 = "8ade5dc5488d13676a26cad16b4d9bf88c947b9f6df44441996fe87ffff6977f"
config_sha256 = "ac74e31f66b57f8ce784e8741bfec3e7d5ade408b03959e1f465331196cd49f5"
site = "residual-pre-attention"
layer = 10

[[captures]]
id = "answer"
site = "logits"

[captures.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-france"
site = "residual-pre-attention"
layers = [10]
inputs = ["france"]
operation = { kind = "replace" }
features = { dictionary = "l10", ids = [3756] }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "france", layer = 10 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-germany"
site = "residual-pre-attention"
layers = [10]
inputs = ["germany"]
operation = { kind = "replace" }
features = { dictionary = "l10", ids = [8633] }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "germany", layer = 10 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-japan"
site = "residual-pre-attention"
layers = [10]
inputs = ["japan"]
operation = { kind = "replace" }
features = { dictionary = "l10", ids = [21761] }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "japan", layer = 10 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-egypt"
site = "residual-pre-attention"
layers = [10]
inputs = ["egypt"]
operation = { kind = "replace" }
features = { dictionary = "l10", ids = [22634] }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "egypt", layer = 10 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-poland"
site = "residual-pre-attention"
layers = [10]
inputs = ["poland"]
operation = { kind = "replace" }
features = { dictionary = "l10", ids = [18838] }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "poland", layer = 10 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-portugal"
site = "residual-pre-attention"
layers = [10]
inputs = ["portugal"]
operation = { kind = "replace" }
features = { dictionary = "l10", ids = [27466] }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "portugal", layer = 10 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-italy"
site = "residual-pre-attention"
layers = [10]
inputs = ["italy"]
operation = { kind = "replace" }
features = { dictionary = "l10", ids = [22778] }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "italy", layer = 10 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-spain"
site = "residual-pre-attention"
layers = [10]
inputs = ["spain"]
operation = { kind = "replace" }
features = { dictionary = "l10", ids = [19172] }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "spain", layer = 10 }

[interventions.tokens]
