# Morphology layerwise capture — exact restoration

# Third run of the morphology workflow: apply the same controlled
# replacement as the intervention run, then restore the exact captured
# original at the same semantic site within the same run. Because the
# restore writes back the pre-intervention snapshot, this run's generated
# tokens must match the baseline bundle bit-for-bit (the frozen restoration
# test, Gate D).

# Baseline: runs/morphology-baseline
# Intervention: runs/morphology-intervention (replace only)

schema = "ember.experiment.v1"

[experiment]
name = "morphology-restoration"
description = "Replace then restore exactly at layer 7; outputs must match the baseline."
seed = 42

[model]
path = "Llama-3.2-1B-Instruct-Q8_0.gguf"
expected_sha256 = "432f310a77f4650a88d0fd59ecdd7cebed8d684bafea53cbff0473542964f0c3"
tokenizer = "tokenizer.json"
tokenizer_expected_sha256 = "6b9e4e7fb171f92fd137b777cc2714bf87d11576700a1dcd7a399e7bbe39537b"

[execution]
mode = "reference"
threads = 8
deterministic = true

[generation]
max_new_tokens = 8
temperature = 0.0

[[inputs]]
id = "example-001"
text = "في الجملة التالية، الكلمة المميزة هي: كِتَاب. اشرح معناها."

[[captures]]
id = "prompt-final"
site = "residual-post-mlp"
layers = "all"

[captures.tokens]
kind = "prompt-final"

[[captures]]
id = "target-final-subtoken"
site = "residual-post-mlp"
layers = "all"

[captures.tokens]
kind = "matched-span"
text = "كِتَاب"
occurrence = 0
subtokens = "final"

[[interventions]]
id = "replace-layer7"
site = "residual-post-mlp"
layers = [7]
operation = { kind = "replace" }
source = { kind = "capture-from-current-run", capture_id = "target-final-subtoken" }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "restore-layer7"
site = "residual-post-mlp"
layers = [7]
operation = { kind = "restore-original" }

[interventions.tokens]
kind = "prompt-final"

[output]
directory = "runs/morphology-restoration"
overwrite = false
