# Activation patching across layers, over eight prompt pairs.
#
# Each input is a corrupted prompt (another country). Each point replaces
# the residual stream entering one block at the final token with the clean
# row from the same layer of runs/capital-clean (capital-clean.toml; run it
# first). `move_bundle_sources` moves the source layer with the swept layer.
#
# The metric is logit(clean capital) - logit(corrupted capital). The
# baseline is the corrupted run, so the effect of a point is the part of the
# clean-minus-corrupted gap that the patch recovers.
#
# Result on the pinned model (Apple M1 Pro, reference mode, 2026-10-08):
# the corrupted baseline metric has a mean of -10.67. Layer 0 recovers
# exactly nothing, because both prompts end with the same token. Layers 1-9
# recover less than 0.5 logits on average. From layer 10, the patch
# recovers 9.8 logits (95% interval 8.8-10.9), and 16.0 at layer 15, on all
# eight pairs. One deterministic run on one 16-layer model.
#
# The source bundle is not pinned, so every point bundle records a warning
# with the semantic hash that the source resolved to. To pin it, set
# semantic_hash in each source to the hash of your runs/capital-clean.
#
#   ember experiment run examples/experiments/capital-clean.toml
#   ember experiment run examples/experiments/capital-patching-sweep.toml
#   ember experiment verify runs/capital-patching-sweep --tokenizer tokenizer.json

schema = "ember.experiment.v1"

[experiment]
name = "capital-patching-sweep"
description = "Patch the clean final-token residual into corrupted capital prompts, per layer."

[model]
path = "Llama-3.2-1B-Instruct-Q8_0.gguf"
expected_sha256 = "432f310a77f4650a88d0fd59ecdd7cebed8d684bafea53cbff0473542964f0c3"
tokenizer = "tokenizer.json"
tokenizer_expected_sha256 = "6b9e4e7fb171f92fd137b777cc2714bf87d11576700a1dcd7a399e7bbe39537b"

[execution]
mode = "reference"
threads = 4
deterministic = true

[generation]
max_new_tokens = 0
temperature = 0.0

[[inputs]]
id = "france"
text = "The capital of Italy is the city of"

[[inputs]]
id = "germany"
text = "The capital of Spain is the city of"

[[inputs]]
id = "japan"
text = "The capital of Russia is the city of"

[[inputs]]
id = "egypt"
text = "The capital of Greece is the city of"

[[inputs]]
id = "poland"
text = "The capital of Austria is the city of"

[[inputs]]
id = "portugal"
text = "The capital of Sweden is the city of"

[[inputs]]
id = "italy"
text = "The capital of France is the city of"

[[inputs]]
id = "spain"
text = "The capital of Germany is the city of"

[[captures]]
id = "answer"
site = "logits"

[captures.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-france"
site = "residual-pre-attention"
layers = [0]
inputs = ["france"]
operation = { kind = "replace" }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "france", layer = 0 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-germany"
site = "residual-pre-attention"
layers = [0]
inputs = ["germany"]
operation = { kind = "replace" }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "germany", layer = 0 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-japan"
site = "residual-pre-attention"
layers = [0]
inputs = ["japan"]
operation = { kind = "replace" }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "japan", layer = 0 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-egypt"
site = "residual-pre-attention"
layers = [0]
inputs = ["egypt"]
operation = { kind = "replace" }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "egypt", layer = 0 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-poland"
site = "residual-pre-attention"
layers = [0]
inputs = ["poland"]
operation = { kind = "replace" }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "poland", layer = 0 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-portugal"
site = "residual-pre-attention"
layers = [0]
inputs = ["portugal"]
operation = { kind = "replace" }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "portugal", layer = 0 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-italy"
site = "residual-pre-attention"
layers = [0]
inputs = ["italy"]
operation = { kind = "replace" }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "italy", layer = 0 }

[interventions.tokens]
kind = "prompt-final"

[[interventions]]
id = "patch-spain"
site = "residual-pre-attention"
layers = [0]
inputs = ["spain"]
operation = { kind = "replace" }
source = { kind = "capture-from-bundle", bundle_path = "runs/capital-clean", capture_id = "final-residual", input_id = "spain", layer = 0 }

[interventions.tokens]
kind = "prompt-final"

[output]
directory = "runs/capital-patching-sweep"
overwrite = false

[sweep]
layers = "all"
move_bundle_sources = true

[sweep.effect]
capture = "answer"

[[sweep.effect.targets]]
input = "france"
target = " Paris"
foil = " Rome"

[[sweep.effect.targets]]
input = "germany"
target = " Berlin"
foil = " Madrid"

[[sweep.effect.targets]]
input = "japan"
target = " Tokyo"
foil = " Moscow"

[[sweep.effect.targets]]
input = "egypt"
target = " Cairo"
foil = " Athens"

[[sweep.effect.targets]]
input = "poland"
target = " Warsaw"
foil = " Vienna"

[[sweep.effect.targets]]
