# Morphology layerwise capture — layer sweep

# The intervention of morphology-intervention.toml (replace the prompt-final
# residual stream with the target word's final-subtoken residual), run at
# every layer instead of layer 7. `ember experiment run` writes one bundle
# per layer plus a baseline (the spec without interventions) and a
# sweep.json/sweep.csv summary: per layer, the first generated step that
# differs from the baseline and the peak capture divergence. The baseline's
# prompt prefix is computed once; each layer resumes from it.

# Every point bundle is exactly the bundle of the derived single-layer spec
# stored as its experiment.toml; `ember experiment verify` checks this.

schema = "ember.experiment.v1"

[experiment]
name = "morphology-layer-sweep"
description = "Replace the prompt-final representation with the target-final-subtoken representation, at every layer."
seed = 42

[model]
path = "Llama-3.2-1B-Instruct-Q8_0.gguf"
expected_sha256 = "432f310a77f4650a88d0fd59ecdd7cebed8d684bafea53cbff0473542964f0c3"
tokenizer = "tokenizer.json"
tokenizer_expected_sha256 = "6b9e4e7fb171f92fd137b777cc2714bf87d11576700a1dcd7a399e7bbe39537b"

[execution]
mode = "reference"
threads = 8
deterministic = true

[generation]
max_new_tokens = 8
temperature = 0.0

[[inputs]]
id = "example-001"
text = "في الجملة التالية، الكلمة المميزة هي: كِتَاب. اشرح معناها."

[[captures]]
id = "prompt-final"
site = "residual-post-mlp"
layers = "all"

[captures.tokens]
kind = "prompt-final"

[[captures]]
id = "target-final-subtoken"
site = "residual-post-mlp"
layers = "all"

[captures.tokens]
kind = "matched-span"
text = "كِتَاب"
occurrence = 0
subtokens = "final"

[[interventions]]
id = "replace"
site = "residual-post-mlp"
layers = [7]
operation = { kind = "replace" }
source = { kind = "capture-from-current-run", capture_id = "target-final-subtoken" }

[interventions.tokens]
kind = "prompt-final"

[output]
directory = "runs/morphology-layer-sweep"
overwrite = false

[sweep]
# "all", an explicit list such as [4, 8, 12], or { start = 0, end = 16, step = 2 }
layers = "all"
