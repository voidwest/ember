<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Packed Q8 decode throughput by projection selection</title>
  <desc id="desc">Horizontal bar chart. Control reaches 21.968 tokens per second. Packing gate and up reaches 27.659. Packing attention, gate, and up while excluding down reaches 30.199. Packing all eligible projections reaches 30.827.</desc>
  <rect width="1000" height="590" fill="#12151a"/>
  <g font-family="Inter,system-ui,sans-serif">
    <text x="64" y="58" fill="#f8f4ea" font-family="Georgia,serif" font-size="30">selective packing keeps most of the gain</text>
    <text x="64" y="88" fill="#a6a6ad" font-size="15">Llama-3.2-1B Q8_0 · median full-model decode · higher is better</text>

    <g stroke="#cec7ba" stroke-opacity=".16" stroke-width="1">
      <line x1="250" y1="125" x2="250" y2="500"/>
      <line x1="343" y1="125" x2="343" y2="500"/>
      <line x1="436" y1="125" x2="436" y2="500"/>
      <line x1="529" y1="125" x2="529" y2="500"/>
      <line x1="621" y1="125" x2="621" y2="500"/>
      <line x1="714" y1="125" x2="714" y2="500"/>
      <line x1="807" y1="125" x2="807" y2="500"/>
      <line x1="900" y1="125" x2="900" y2="500"/>
    </g>

    <g fill="#7e7f87" font-size="13" text-anchor="middle">
      <text x="250" y="526">0</text>
      <text x="343" y="526">5</text>
      <text x="436" y="526">10</text>
      <text x="529" y="526">15</text>
      <text x="621" y="526">20</text>
      <text x="714" y="526">25</text>
      <text x="807" y="526">30</text>
      <text x="900" y="526">35</text>
    </g>
    <text x="900" y="554" fill="#a6a6ad" font-size="13" text-anchor="end">decode tokens / second</text>

    <g font-size="15">
      <text x="226" y="165" fill="#f3efe5" text-anchor="end">control</text>
      <text x="226" y="255" fill="#f3efe5" text-anchor="end">gate + up</text>
      <text x="226" y="345" fill="#f3efe5" text-anchor="end">no down</text>
      <text x="226" y="435" fill="#f3efe5" text-anchor="end">all eligible</text>
    </g>
    <g fill="#7e7f87" font-size="12" text-anchor="end">
      <text x="226" y="184">0 MiB packed</text>
      <text x="226" y="274">544 MiB packed</text>
      <text x="226" y="364">714 MiB packed</text>
      <text x="226" y="454">986 MiB packed</text>
    </g>

    <rect x="250" y="139" width="408" height="42" fill="#65616f"/>
    <rect x="250" y="229" width="514" height="42" fill="#746b9a"/>
    <rect x="250" y="319" width="561" height="42" fill="#9b8fd1"/>
    <rect x="250" y="409" width="573" height="42" fill="#776da0"/>

    <g fill="#f8f4ea" font-size="15" font-weight="650">
      <text x="670" y="165">21.968</text>
      <text x="776" y="255">27.659</text>
      <text x="823" y="345">30.199</text>
      <text x="835" y="435">30.827</text>
    </g>
    <text x="823" y="365" fill="#b3a7e2" font-size="12">92.9% of the full gain</text>
  </g>
</svg>
