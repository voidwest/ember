<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="t6 d6">
  <title id="t6">Divergence ramp and causal locus (Part 6)</title>
  <desc id="d6">Two model-family divergence profiles show the causal locus immediately before the visible ramp. Patching that single layer restores the output.</desc>
  <style>.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
