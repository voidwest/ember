    .curve { stroke: #6659a1; stroke-width: 3; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .locus { fill: #ad3d30; stroke: #fbf8f1; stroke-width: 2; }
    .title { fill: #18191b; font-size: 17px; text-anchor: middle; }
    .panel-title { fill: #18191b; font-size: 15px; text-anchor: start; }
    .muted { fill: #66676b; font-size: 12px; }
    .tick { fill: #77746e; font-size: 11px; text-anchor: middle; }
    .accent { fill: #6659a1; font-size: 13px; }
    .evidence { fill: #ece6da; stroke: #8275bc; stroke-width: 1.4; rx: 7; }
    .result { fill: #ece6da; stroke: #8275bc; stroke-width: 1.8; rx: 9; }
    .arrow { stroke: #8275bc; stroke-width: 1.8; fill: none; }
    .result-title { fill: #6659a1; font-size: 17px; text-anchor: middle; }
    .result-copy { fill: #18191b; font-size: 13px; text-anchor: middle; }
    .foot { fill: #66676b; font-size: 12px; text-anchor: middle; }</style>
