<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="tl tl2">
  <title id="tl">The validation ladder</title>
  <desc id="tl2">Five rungs from support to causal claims: smoke, golden logits, activation-reference checks, probes, interventions. Each rung is a different claim; "supported" means an execution path exists.</desc>
  <style>.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .rung { fill: #0d1014; stroke: rgba(206,199,186,0.32); stroke-width: 1.4; rx: 8; }
    .rungtext { fill: #f3efe5; font-size: 16px; text-anchor: middle; }
    .accent-rung { fill: #12151a; stroke: #9b8fd1; stroke-width: 1.8; rx: 8; }
    .accent-text { fill: #b3a7e2; font-size: 16px; text-anchor: middle; }
    .step { fill: #a6a6ad; font-size: 13px; text-anchor: middle; }
    .annot { fill: #7e7f87; font-size: 14px; }
    .arrow { stroke: #7e7f87; stroke-width: 1.7; fill: none; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7e7f87" />
    </marker>
  </defs>
  <text class="mono step" x="64" y="80" fill="#7e7f87">support</text>
  <rect class="rung" x="120" y="52" width="150" height="56" />
  <text class="mono rungtext" x="195" y="78">smoke</text>
  <text class="mono step" x="195" y="98" font-size="12">the command ran</text>
  <line class="arrow" x1="270" y1="80" x2="310" y2="80" marker-end="url(#arrow)" />
  <rect class="rung" x="314" y="52" width="150" height="56" />
  <text class="mono rungtext" x="389" y="78">golden logits</text>
  <text class="mono step" x="389" y="98" font-size="12">vs trusted ref</text>
  <line class="arrow" x1="464" y1="80" x2="504" y2="80" marker-end="url(#arrow)" />
  <rect class="rung" x="508" y="52" width="150" height="56" />
  <text class="mono rungtext" x="583" y="78">activation-ref</text>
  <text class="mono step" x="583" y="98" font-size="12">states compared</text>
  <line class="arrow" x1="658" y1="80" x2="698" y2="80" marker-end="url(#arrow)" />
  <rect class="rung" x="702" y="52" width="150" height="56" />
  <text class="mono rungtext" x="777" y="78">probes</text>
  <text class="mono step" x="777" y="98" font-size="12">decodability</text>
  <line class="arrow" x1="852" y1="80" x2="892" y2="80" marker-end="url(#arrow)" />
  <rect class="accent-rung" x="896" y="52" width="160" height="56" />
  <text class="mono accent-text" x="976" y="78">interventions</text>
  <text class="mono step" x="976" y="98" font-size="12">causal use</text>
  <text class="mono annot" x="64" y="160">each rung is a different claim: "supported" means an execution path exists, it does not mean the row is</text>
  <text class="mono annot" x="64" y="182">numerically validated. top-1 agreement is not logit equality; deterministic semantic output is not</text>
  <text class="mono annot" x="64" y="204">timing reproducibility (docs/validation.md; the rungs the whole series cites).</text>
</svg>
