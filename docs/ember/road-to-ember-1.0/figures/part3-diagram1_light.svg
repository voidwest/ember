<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="548" viewBox="0 0 1120 548" role="img" aria-labelledby="t3 d3">
  <title id="t3">Eager expansion vs compressed residency (v0.3)</title>
  <desc id="d3">The reference path expands the whole weight matrix to f32; the v0.3 path keeps packed blocks mmap-resident and runs native K-quant matvec.</desc>
  <style>.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .box { fill: #fbf8f1; stroke: rgba(92,84,72,0.38); stroke-width: 1.3; rx: 8; }
    .boxlabel { fill: #18191b; font-size: 16px; text-anchor: middle; }
    .accent-box { fill: #ece6da; stroke: #8275bc; stroke-width: 1.6; rx: 8; }
    .accent-label { fill: #6659a1; font-size: 16px; text-anchor: middle; }
    .red-box { fill: #fbf8f1; stroke: #ad3d30; stroke-width: 1.7; stroke-dasharray: 6 4; rx: 8; }
    .red-label { fill: #ad3d30; font-size: 16px; text-anchor: middle; }
    .arrow { stroke: #77746e; stroke-width: 1.6; fill: none; }
    .colhead { fill: #66676b; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; }
    .annot { fill: #66676b; font-size: 14px; }
    .verdict { fill: #18191b; font-size: 16px; text-anchor: middle; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#77746e" />
    </marker>
  </defs>
  <text class="mono colhead" x="64" y="60">old path, eager f32 expansion (reference)</text>
  <g>
    <rect class="box" x="64" y="78" width="260" height="58" />
    <text class="mono boxlabel" x="194" y="113">GGUF Q4_K/Q6_K</text>
    <line class="arrow" x1="194" y1="136" x2="194" y2="168" marker-end="url(#arrow)" />
    <rect class="box" x="64" y="172" width="260" height="58" />
    <text class="mono boxlabel" x="194" y="207">load tensor</text>
    <line class="arrow" x1="194" y1="230" x2="194" y2="262" marker-end="url(#arrow)" />
    <rect class="red-box" x="64" y="266" width="260" height="58" />
    <text class="mono red-label" x="194" y="301">dequantize entire matrix</text>
    <line class="arrow" x1="194" y1="324" x2="194" y2="356" marker-end="url(#arrow)" />
    <rect class="red-box" x="64" y="360" width="260" height="58" />
    <text class="mono red-label" x="194" y="395">f32 heap allocation</text>
    <line class="arrow" x1="194" y1="418" x2="194" y2="450" marker-end="url(#arrow)" />
    <rect class="box" x="64" y="454" width="260" height="58" />
    <text class="mono boxlabel" x="194" y="489">f32 matvec</text>
  </g>
  <text class="mono annot" x="64" y="533">eager: roughly 6.99–8.84 GB peak RSS (measured, 2026-08-04)</text>
  <text class="mono colhead" x="620" y="60">v0.3, compressed residency (native)</text>
  <g>
    <rect class="box" x="620" y="78" width="300" height="58" />
    <text class="mono boxlabel" x="770" y="113">GGUF Q4_K/Q6_K</text>
    <line class="arrow" x1="770" y1="136" x2="770" y2="168" marker-end="url(#arrow)" />
    <rect class="accent-box" x="620" y="172" width="300" height="58" />
    <text class="mono accent-label" x="770" y="207">mmap packed blocks</text>
    <line class="arrow" x1="770" y1="230" x2="770" y2="262" marker-end="url(#arrow)" />
    <rect class="accent-box" x="620" y="266" width="300" height="58" />
    <text class="mono accent-label" x="770" y="301">KQuantWeight view</text>
    <line class="arrow" x1="770" y1="324" x2="770" y2="356" marker-end="url(#arrow)" />
    <rect class="accent-box" x="620" y="360" width="300" height="58" />
    <text class="mono accent-label" x="770" y="395">scalar / AVX2 packed matvec</text>
  </g>
  <text class="mono annot" x="620" y="519">compressed: roughly 0.84–1.27 GB peak RSS</text>
  <text class="mono annot" x="620" y="537">no full-weight expansion</text>
</svg>
