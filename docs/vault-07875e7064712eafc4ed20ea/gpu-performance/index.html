function lab(i){if(i===0)return labShell('The life of an inference request',`<p>Select a phase to see prompt processing and the first decode step. Highlighted output is newly available in the selected phase.</p><div class="segmented" id="phases"><button class="selected" data-phase="prefill" aria-pressed="true">01 Prefill</button><button data-phase="decode" aria-pressed="false">02 Decode</button></div><div class="pipeline"><div><div class="flow-label">Input sequence</div><div class="tokens" id="input-tokens"></div></div><div><div class="flow-label">Generated sequence</div><div class="tokens" id="output-tokens"></div></div></div><div class="formula" id="phase-formula"></div><p id="phase-explanation" style="margin:15px 0 0"></p>`);
if(i===1)return labShell('Follow the memory addresses',`<p>A simplified address map for 8 active lanes within a 32-thread CUDA warp, each reading a 4-byte value. Each row represents a 32-byte aligned memory sector.</p><div class="segmented" id="strides"><button class="selected" data-stride="1" aria-pressed="true">Contiguous</button><button data-stride="4" aria-pressed="false">Stride 4</button><button data-stride="8" aria-pressed="false">Stride 8</button></div><div class="mini-grid" id="memory-grid" style="grid-template-columns:repeat(8,1fr)"></div><div class="result" id="memory-result"></div><p class="quiet">Illustrative sector accounting for compute capability 6.0 or later, with aligned base addresses and no cache effects. The other 24 lanes are inactive; stride is measured in 4-byte elements. This is not a GPU timing simulation.</p>`);
if(i===2)return labShell('Find the roofline',`<p>Change arithmetic intensity to move the workload along an illustrative performance ceiling.</p><svg class="chart" viewBox="0 0 600 245" role="img" aria-label="Roofline graph with arithmetic intensity on the horizontal axis and throughput on the vertical axis"><g class="grid"><path d="M55 25V200H570" fill="none"/><path d="M55 156.25H570M55 112.5H570M55 68.75H570" fill="none"/></g><text x="55" y="15">Ceiling (TFLOP/s)</text><text x="18" y="203">0</text><text x="9" y="117">500</text><text x="3" y="30">1000</text><path d="M55 200L312.5 25H570" fill="none" stroke="var(--accent)" stroke-width="3"/><line id="roof-guide" x1="80" x2="80" y1="200" y2="190" stroke="var(--muted)" stroke-dasharray="4 4"/><circle id="roof-dot" cx="80" cy="190" r="7" fill="var(--accent)" stroke="var(--highlight)" stroke-width="3"/><text x="55" y="222">0</text><text x="298" y="222">500</text><text x="540" y="222">1000</text><text x="235" y="242">Intensity (FLOP/byte)</text></svg><div class="controls">${slider('intensity','Arithmetic intensity',10,1000,100,10)}</div><div class="result" id="roof-result"></div><div class="formula">P ≤ min(1,000 TFLOP/s, 2 TB/s × intensity)</div><p class="quiet" style="margin-top:12px">Hypothetical device-memory bandwidth and compute peak, in decimal units. Count bytes crossing that memory boundary and use a consistent FLOP convention and precision. The marker shows the analytical ceiling, not measured kernel performance.</p>`);
if(i===3)return labShell('Choose the next experiment',`<p>A system trace shows gaps between host launch calls and short GPU kernels. What is the best next investigation?</p><div class="quiz-options" data-answer="1"><button data-choice="0">Rewrite every kernel in a lower-level language</button><button data-choice="1">Inspect host scheduling and launch overhead</button><button data-choice="2">Increase the tile size in the smallest kernel</button></div><p class="feedback" role="status"></p>`);
if(i===4)return labShell('Size the KV cache',`<p>Estimate total logical dense-cache storage for equal-length sequences, uniform layers, and matching key/value dimensions and element sizes. All inputs are editable.</p><div class="controls">${slider('batch','Concurrent sequences',1,64,8)}${slider('context','Cached tokens / sequence',512,32768,4096,512)}${slider('layers','Layers',8,96,32,8)}${slider('heads','KV heads',1,32,8)}${slider('dimension','Head dimension',32,256,128,32)}<div class="control"><label for="precision">Bytes per element</label><select id="precision"><option value="2">2 bytes · FP16 / BF16</option><option value="1">1 byte · 8-bit</option><option value="4">4 bytes · FP32</option></select></div></div><div class="result" id="kv-result" aria-live="polite"></div><div class="formula">bytes = 2 × sequences × tokens × layers<br>× KV heads × head dimension × bytes/element</div><p class="quiet" style="margin-top:12px">The factor 2 represents keys and values. Excludes weights, workspaces, allocator overhead, quantization metadata, and cache sharing; not an MLA or sliding-window model. Per-device storage depends on sharding and replication. GiB = 2³⁰ bytes.</p>`);
if(i===5)return labShell('The limit to parallel speedup',`<p>Amdahl’s law models a fixed workload. The serial fraction is the fraction of one-worker execution time that cannot be parallelized.</p><div class="controls">${slider('workers','Workers',1,64,8)}${slider('serial','Serial fraction (%)',0,50,10)}</div><div class="result" id="scale-result"></div><div class="formula" id="scale-formula"></div><p class="quiet" style="margin-top:12px">Assumes identical workers, perfectly divisible parallel work, and no additional communication overhead. Real distributed inference has additional costs.</p>`);
if(i===6)return labShell('Build a fair comparison',`<p>Use this checklist before comparing accelerator results. Checks apply to this reading session.</p><div class="checklist">${['Same operation, shapes, and batch size','Same precision and accuracy requirement','Dense or sparse assumptions made explicit','Memory capacity and bandwidth considered','Software versions and kernel implementations recorded','Measured latency and throughput on the target workload'].map(t=>`<label><input type="checkbox" class="hardware-check">${t}</label>`).join('')}</div><div class="formula" id="hardware-result" role="status">0 / 6 comparison conditions checked</div>`);
return labShell('Does the evidence support the claim?',`<p>“Our generated kernel is 3× faster.” The report names the GPU and shape but gives no numerical correctness test. What can you conclude?</p><div class="quiz-options" data-answer="2"><button data-choice="0">The kernel is ready to replace the baseline</button><button data-choice="1">Any speedup above 2× is sufficient evidence</button><button data-choice="2">Correctness must be established before accepting the speedup</button></div><p class="feedback" role="status"></p>`)}
function render(){const m=location.hash.match(/^#chapter-(\d+)/);current=m?Math.min(7,Number(m[1])):0;const c=CH[current];document.title=c.title+' · GPU Performance Fieldbook';$('#crumb').textContent=c.title;nav();let n=0;const count=c.groups.reduce((a,g)=>a+g.resources.length,0);
$('#content').innerHTML=`<div class="eyebrow">${esc(c.label)}<span>•</span>GPU performance engineering</div><h1>${current===0?'Performance begins<br>with a <em>mental model.</em>':esc(c.title)}</h1><p class="deck">${esc(c.subtitle)}</p><div class="chapter-meta"><span>${count} curated resources</span><span>1 interactive notebook</span><span>${String(current+1).padStart(2,'0')} / 08</span></div><div class="editorial-label">READER’S GUIDE · ADDED EXPLANATIONS & EXERCISES</div><p class="intro">${esc(c.intro)}</p>${c.sections.map((s,i)=>`<section id="section-${i}"><h2>${esc(s.title)}</h2><p>${s.body}</p>${citations(s.sources)}</section>${i===0?lab(current):''}`).join('')}<div class="exercise" id="practice"><b>Pause & apply</b><p>${esc(c.exercise)}</p></div><section id="reading"><div class="reading-head"><h2>The reading shelf</h2><span>${count} resources</span></div><p class="quiet" style="margin-top:10px">${current===0?'Follow the first eight in order. GPU Mode is the practical companion. Audit notes are additions dated 2 October 2026.':'Original entries from the Wafer collection. Audit notes are additions dated 2 October 2026. Links open in a new tab.'}</p>${c.groups.map(g=>`<div class="resource-group"><h3>${esc(g.title)}</h3>${g.resources.map(r=>`<div class="resource" id="resource-${r.id}"><span class="number">${String(++n).padStart(2,'0')}</span><div><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}<span class="sr-only"> (opens in a new tab)</span></a>${r.description?`<p>${esc(r.description)}</p>`:''}<div class="domain">${esc(new URL(r.url).hostname.replace('www.',''))}</div>${r.audit?`<div class="audit-note"><b>${esc(r.audit.label)} · 2 Oct 2026</b><br>${esc(r.audit.body)} <a href="${esc(r.audit.url)}" target="_blank" rel="noopener">${esc(r.audit.link)}</a></div>`:''}</div></div>`).join('')}${g.notes.length?`<ul class="watchlist">${g.notes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div>`).join('')}</section><label class="completion"><input type="checkbox" id="complete" ${state.done.includes(current)?'checked':''}>Mark this chapter as completed <span class="quiet">· saved on this device</span></label><div class="bottom-nav"><button id="prev" ${current===0?'disabled':''}>Previous chapter</button><button class="primary" id="next">${current===7?'Back to the beginning':'Next: '+CH[current+1].title}</button></div><details class="source-details"><summary>Original README and source policy</summary><p>The unmodified Markdown text below includes the original introduction, source policy, license statement, and maintainer information. It also retains the original cover-image reference.</p><a id="download-original" download="wafer-gpu-resources-README.md" href="data:text/markdown;charset=utf-8,${encodeURIComponent(DATA.originalReadme)}">Download original README</a><pre>${esc(DATA.originalReadme)}</pre></details><details class="source-details"><summary>Read the verification report</summary><iframe title="Verification report" src="${esc(DATA.auditReportDataUrl)}" loading="lazy" sandbox style="width:100%;height:70vh;min-height:400px;border:1px solid var(--line);border-radius:8px;background:white"></iframe></details><footer class="source-note"><p><strong>Portable HTML edition.</strong> This entire book runs in your browser. Use “Download offline HTML” to keep a local copy. No account, API key, installation, or hosting service is required. Chapters, search, notebooks, the original README, and this verification report are embedded. Linked papers and external websites require internet. Reading progress and appearance preferences stay in this browser when local storage is available.</p><p><strong>Audit completed 2 October 2026.</strong> Checked source fidelity, resource destinations, added explanations, model arithmetic, and interface behavior. Audit notes flag inherited issues. External performance results have not been reproduced on GPUs. The official OCP MX PDF has now been reviewed. A second interpretation pass clarified model assumptions and the limits of test evidence. <a href="${esc(DATA.auditReportDataUrl||'verification.html')}" download="gpu-fieldbook-verification.html">Download the verification report</a>.</p><p>Adapted from <a href="https://github.com/wafer-ai/gpu-perf-engineering-resources" target="_blank" rel="noopener">Wafer’s GPU performance engineering resources</a>, which identifies its license as MIT. Resource titles, descriptions, order, and links are preserved. Chapter explanations and interactive notebooks are added editorial material; they are not statements by the repository maintainers.</p><p>Source snapshot: <a href="https://github.com/wafer-ai/gpu-perf-engineering-resources/tree/${DATA.commit}" target="_blank" rel="noopener">${DATA.commit.slice(0,7)}</a> · Adapted 2 October 2026. The frontier’s verification date belongs to the source repository. <a href="https://github.com/wafer-ai/gpu-perf-engineering-resources/blob/${DATA.commit}/README.md#source-policy" target="_blank" rel="noopener">Source policy</a>: prefer original papers, official documentation, implementing repositories, and reproducible reports.</p></footer>`;
$('#toc').innerHTML=`<div class="label">IN THIS CHAPTER</div>${c.sections.map((s,i)=>`<a href="#section-${i}" data-jump="section-${i}">${esc(s.title)}</a>`).join('')}<a href="#interactive" data-jump="interactive">Interactive notebook</a><a href="#practice" data-jump="practice">Pause & apply</a><a href="#reading" data-jump="reading">The reading shelf</a><div class="toc-note">“What is the system waiting for?”</div>`;document.querySelectorAll('[data-jump]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.jump).scrollIntoView()});$('#prev').onclick=()=>go(current-1);$('#next').onclick=()=>go((current+1)%8);$('#complete').onchange=e=>{state.done=state.done.filter(i=>i!==current);if(e.target.checked)state.done.push(current);save();nav()};wireLab();closeMenu();scrollProgress()}
function wireLab(){if(current===0){const update=phase=>{const decode=phase==='decode';$('#input-tokens').innerHTML=['Explain','GPU','memory'].map(t=>`<span class="token ${decode?'dim':'lit'}">${t}</span>`).join('');$('#output-tokens').innerHTML=['GPUs','use','…'].map((t,i)=>`<span class="token ${decode?(i===1?'lit':i===2?'dim':''):(i===0?'lit':'dim')}">${t}</span>`).join('');$('#phase-formula').textContent=decode?'Cached context + latest token → next-token prediction':'Prompt tokens → model → KV cache + first-token prediction';$('#phase-explanation').textContent=decode?'The first decode step consumes “GPUs”, appends its KV state, and predicts “use”. Small batches can make weight movement a major cost. These displayed words are illustrative token labels.':'Prefill builds the prompt KV cache and produces logits used to sample the first token, “GPUs”. The next decode step processes that token to predict “use”. These displayed words are illustrative token labels.';document.querySelectorAll('[data-phase]').forEach(b=>{b.classList.toggle('selected',b.dataset.phase===phase);b.setAttribute('aria-pressed',b.dataset.phase===phase)})};document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>update(b.dataset.phase));update('prefill')}
if(current===1){const update=stride=>{const {indices,sectors}=models.memory(stride);$('#memory-grid').innerHTML=Array.from({length:64},(_,i)=>`<span class="cell ${indices.includes(i)?'lit':''}" title="Byte address ${i*4}" aria-hidden="true"></span>`).join('');$('#memory-result').innerHTML=`${sectors} ${sectors===1?'sector':'sectors'} <small>for 32 useful bytes · ${Number((100/sectors).toFixed(1))}% sector utilization</small>`;document.querySelectorAll('[data-stride]').forEach(b=>{b.classList.toggle('selected',+b.dataset.stride===stride);b.setAttribute('aria-pressed',+b.dataset.stride===stride)})};document.querySelectorAll('[data-stride]').forEach(b=>b.onclick=()=>update(+b.dataset.stride));update(1)}
const calculators={2:()=>{let x=+$('#intensity').value,p=models.roofline(x),sx=55+x*.515,sy=200-p*.175;$('#roof-dot').setAttribute('cx',sx);$('#roof-dot').setAttribute('cy',sy);$('#roof-guide').setAttribute('x1',sx);$('#roof-guide').setAttribute('x2',sx);$('#roof-guide').setAttribute('y2',sy);$('#roof-result').innerHTML=`${p.toLocaleString()} TFLOP/s <small>· ${x<500?'bandwidth-limited ceiling':x===500?'at the ridge point':'compute-limited ceiling'}</small>`},4:()=>{const bytes=models.kvBytes(...['batch','context','layers','heads','dimension','precision'].map(id=>+$('#'+id).value));$('#kv-result').innerHTML=`${models.formatBytes(bytes)} <small>total logical KV cache</small>`},5:()=>{let n=+$('#workers').value,s=+$('#serial').value/100,speed=models.amdahl(n,s);$('#scale-result').innerHTML=`${speed.toFixed(2)}× <small>ideal speedup with ${n} ${n===1?'worker':'workers'}</small>`;$('#scale-formula').textContent=`Speedup = 1 / (${s.toFixed(2)} + ${(1-s).toFixed(2)} / ${n})`}};if(calculators[current]){const update=()=>{document.querySelectorAll('.lab input[type=range]').forEach(el=>$('#'+el.id+'-out').textContent=Number(el.value).toLocaleString());calculators[current]()};document.querySelectorAll('.lab input,.lab select').forEach(el=>el.oninput=update);update()}
if(current===3||current===7){const quiz=$('.quiz-options');quiz.querySelectorAll('button').forEach(b=>b.onclick=()=>{const correct=b.dataset.choice===quiz.dataset.answer;quiz.querySelectorAll('button').forEach(x=>x.classList.remove('correct','incorrect'));b.classList.add(correct?'correct':'incorrect');$('.feedback').textContent=correct?(current===3?'Correct. Correlate CPU activity, launch calls, synchronization, and GPU work. The gaps suggest where to investigate; they do not prove that launch overhead is the cause.':'Correct. A fast result is useful only if it performs the required computation accurately.'):'Try again. Start with the evidence the scenario actually provides.'})}
if(current===6)document.querySelectorAll('.hardware-check').forEach(x=>x.onchange=()=>{const count=document.querySelectorAll('.hardware-check:checked').length;$('#hardware-result').textContent=`${count} / 6 comparison conditions checked${count===6?' · Ready to examine the measurements.':''}`})}
function go(i){location.hash='chapter-'+i}window.addEventListener('hashchange',()=>{if(/^#chapter-\d+$/.test(location.hash)){render();window.scrollTo(0,0);$('#content').focus({preventScroll:true})}});
$('#chapters').addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.hash===location.hash)closeMenu()});$('.skip').onclick=e=>{e.preventDefault();$('#content').focus();$('#content').scrollIntoView()};
function closeMenu(){$('#rail').classList.remove('open');$('#menu').setAttribute('aria-expanded','false')}$('#menu').onclick=()=>{const open=$('#rail').classList.toggle('open');$('#menu').setAttribute('aria-expanded',open)};$('#veil').onclick=closeMenu;$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';prefs();save();try{localStorage.setItem('voidwest-theme',state.theme)}catch(e){}};$('#font').onclick=()=>{state.large=!state.large;prefs();save()};
function openSearch(){$('#search-dialog').showModal();$('#search-input').value='';search();$('#search-input').focus()}$('#search-open').onclick=openSearch;$('#mobile-search').onclick=openSearch;$('#search-close').onclick=()=>$('#search-dialog').close();$('#search-dialog').onclick=e=>{if(e.target===$('#search-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}};
function search(){const q=$('#search-input').value.trim().toLowerCase(),results=[];if(!q){$('#search-results').innerHTML='<p class="search-hint">Search all 8 chapters and 123 resources. Try “attention”, “profiling”, or “KV cache”.</p>';return}CH.forEach((c,i)=>{if((c.title+' '+c.intro+' '+c.sections.map(s=>s.title+' '+s.body).join(' ')).toLowerCase().includes(q))results.push(`<button class="search-result" data-chapter="${i}"><span>CHAPTER ${String(i).padStart(2,'0')}</span><strong>${esc(c.title)}</strong></button>`);c.groups.forEach(g=>g.resources.forEach(r=>{if((r.title+' '+r.description+' '+g.title).toLowerCase().includes(q))results.push(`<a class="search-result" href="${esc(r.url)}" target="_blank" rel="noopener"><span>${esc(c.title)} · RESOURCE</span><strong>${esc(r.title)}</strong><span>${esc(r.description)}</span></a>`)}))});$('#search-results').innerHTML=results.length?`<p class="quiet">${results.length} results</p>`+results.join(''):'<p class="search-hint">No matches. Try a broader term, such as “CUDA” or “inference”.</p>';document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{$('#search-dialog').close();go(+b.dataset.chapter)})}$('#search-input').oninput=search;document.addEventListener('keydown',e=>{if((e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key==='k'))&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();if(!$('#search-dialog').open)openSearch()}if(e.key==='Escape'){closeMenu();if($('#search-dialog').open)$('#search-dialog').close()}});function scrollProgress(){const h=document.documentElement.scrollHeight-innerHeight;$('#read-progress').style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%'}window.addEventListener('scroll',scrollProgress,{passive:true});render();
</script></body></html>
