/* Voidwest vault: warm paper, restrained cobalt, and a quiet reading rail. */
:root { --paper:#f3f0e9; --bg:#ece9e1; --ink:#242424; --muted:#666763;
  --line:#cfccc3; --soft:#e5e1d7; --accent:#244ea9; --highlight:#dbe4fb;
  --rail:#ece9e1; --active-ink:#244ea9; --success:#315f3d; color-scheme:light; }
body.dark { --paper:#111214; --bg:#15171a; --ink:#e9e6de; --muted:#a1a19d;
  --line:#393b40; --soft:#202329; --accent:#9ab5ff; --highlight:#293b61;
  --rail:#15171a; --active-ink:#d7e2ff; --success:#abd0b2; color-scheme:dark; }
html { background:var(--paper); }
body { font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased; }
::selection { background:var(--highlight); color:var(--ink); }
button, .token, .formula, .control select, .control input[type=number] { border-radius:3px; }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline-color:var(--accent); }
.rail { background:var(--rail); color:var(--ink); border-right:1px solid var(--line); padding:26px 22px 22px; }
.vault-home { display:flex; align-items:center; gap:10px; text-decoration:none; font-size:15px; font-weight:650; margin:0 0 30px; }
.vault-home span { color:var(--muted); font:11px ui-monospace,monospace; font-weight:400; letter-spacing:.5px; }
.vault-home:hover span { color:var(--accent); }
.brand { font-size:16px; letter-spacing:-.4px; line-height:1.35; }
.mark { width:34px; height:38px; border:1px solid var(--line); background:transparent; color:var(--accent); border-radius:2px; font:14px ui-monospace,monospace; }
.edition { color:var(--muted); font-size:10px; letter-spacing:1px; margin:20px 0; }
.search-launch { border-color:var(--line); color:var(--muted); background:transparent; border-radius:3px; }
.search-launch:hover { color:var(--ink); background:var(--soft); }
kbd { border-color:var(--line); }
.nav-label { color:var(--muted); font-size:10px; margin-top:26px; }
.chapters a { color:var(--muted); border-radius:2px; padding:10px 9px; font-size:13px; }
.chapters a:hover { background:var(--soft); color:var(--ink); }
.chapters a.active { background:var(--highlight); color:var(--active-ink); }
.chapters .tick { color:var(--accent); }
.rail-footer { border-color:var(--line); color:var(--muted); padding-top:17px; font-size:11px; }
.rail-footer a { display:block; margin-top:7px; font-size:12px; text-decoration:none; }
.rail-footer a:hover { color:var(--accent); text-decoration:underline; }
.progress-track { background:var(--line); margin:9px 0 13px; height:2px; }
.progress-fill,.read-progress { background:var(--accent); }
.topbar { height:68px; padding-inline:42px; background:var(--paper); }
.breadcrumb { font-size:12px; }
.tools button { font-size:12px; }
h1 { font-size:clamp(42px,4.3vw,64px); line-height:1.08; letter-spacing:-1.7px; }
h1 em { color:var(--accent); }
.deck { font-size:18px; }
.intro { font-size:22px; }
.eyebrow { font-size:10px; letter-spacing:1.3px; }
.chapter-meta { font-size:11px; }
.editorial-label { font-size:10px; letter-spacing:.7px; }
.lab { border-radius:3px; background:var(--bg); }
.lab h3 { font-size:26px; }
.lab-top { font-size:10px; letter-spacing:1px; }
.lab-top .tag { border-radius:2px; font-size:10px; }
.segmented button.selected { background:var(--highlight); border-color:var(--accent); color:var(--active-ink); }
.token.lit { background:var(--highlight); color:var(--active-ink); border-color:var(--accent); }
.cell.lit { background:var(--highlight); border-color:var(--accent); }
.control input[type=range], .completion input, .checklist input { accent-color:var(--accent); }
.exercise,.audit-note { border-color:var(--accent); }
.exercise b { color:var(--accent); }
.primary { background:var(--accent); border-color:var(--accent); color:var(--paper); }
.primary:hover { background:var(--ink); border-color:var(--ink); color:var(--paper); }
.quiz-options .correct { background:var(--highlight); color:var(--active-ink); border-color:var(--accent); }
.quiz-options .incorrect { border-color:#b46d58; }
.skip { background:var(--highlight); color:var(--active-ink); }
.source-note { font-size:12px; }
.source-note a, .citations a { color:var(--accent); }
@media(max-height:800px) and (min-width:761px) {
  .vault-home { margin-bottom:20px; } .edition { margin-block:15px; }

}

}

", "audit": {"label": "Metric clarification", "body": "Etalon’s central contribution is fluidity-index and fluid token generation rate. Average TPOT alone can hide stalls; the source description is a brief reading cue, not a complete summary.", "url": "https://arxiv.org/html/2407.07000", "link": "Metric definitions"}}, {"title": "GPU Mode lectures", "url": "https://github.com/gpu-mode/lectures", "description": "", "id": "0-1-8"}], "notes": []}], "title": "The minimum mental model", "label": "Start here", "subtitle": "Follow one request. Find the expensive work.", "intro": "Every optimization starts with a question: what is the system waiting for? Before tuning a kernel, trace the request from prompt to generated tokens. Then connect the work to compute, memory, and communication.", "sections": [{"title": "One request, two workloads", "body": "For standard autoregressive decoding with a transformer KV cache, <strong>prefill<\/strong> processes the prompt and builds its keys and values. The final prompt position produces logits used to choose the first output token. Subsequent <strong>decode<\/strong> steps process newly generated tokens while reusing cached keys and values. This is the baseline illustrated here; prefix caching, chunked prefill, and speculative decoding can change how the work is scheduled.", "sources": [{"title": "How to Scale Your Model: Inference", "url": "https://jax-ml.github.io/scaling-book/inference/"}]}, {"title": "Choose the metric before the optimization", "body": "<strong>Time to first token (TTFT)<\/strong> runs from request arrival to the first output token; state whether those timestamps are measured at the client or server. <strong>Time per output token (TPOT)<\/strong> commonly means the time from first to last output token divided by the number of subsequent tokens. That average can hide pauses; it is undefined for a one-token output. Throughput counts requests or tokens per second. <strong>Goodput<\/strong> ties useful throughput to service objectives, but definitions vary: DistServe uses the maximum sustainable request rate at a specified SLO attainment target. State the exact metric, workload, and latency targets.", "sources": [{"title": "Etalon", "url": "https://arxiv.org/html/2407.07000"}, {"title": "DistServe: goodput definition", "url": "https://arxiv.org/html/2401.09670#S1"}]}, {"title": "Read with a question in mind", "body": "The eight starting resources below form the repository’s recommended sequence. Begin with the inference overview, connect it to the transformer and CUDA execution models, then use the performance models to make a prediction you can test.", "sources": [{"title": "Original reading sequence", "url": "https://github.com/wafer-ai/gpu-perf-engineering-resources/blob/1c52412c3e36b678b43bc414522a790a8cb0212c/README.md#start-here-the-minimum-mental-model"}]}], "exercise": "Before moving on, explain why a server can process more tokens per second while making an individual user wait longer.", "labSources": [{"title": "How to Scale Your Model: Inference", "url": "https://jax-ml.github.io/scaling-book/inference/"}]}, {"originalTitle": "1. GPU fundamentals", "groups": [{"title": "Programming model", "resources": [{"title": "CUDA Programming Guide", "url": "https://docs.nvidia.com/cuda/cuda-programming-guide/", "description": "The normative CUDA reference.", "id": "1-2-0"}, {"title": "CUDA programming model", "url": "https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html", "description": "Threads, warps, blocks, grids, and the memory hierarchy.", "id": "1-2-1"}, {"title": "CUDA C++ Best Practices Guide", "url": "https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/", "description": "Coalescing, shared memory, occupancy, synchronization, and optimization workflow.", "id": "1-2-2"}, {"title": "Hopper Tuning Guide", "url": "https://docs.nvidia.com/cuda/hopper-tuning-guide/", "description": "TMA, thread-block clusters, asynchronous execution, and Hopper-specific limits.", "id": "1-2-3"}, {"title": "Blackwell Tuning Guide", "url": "https://docs.nvidia.com/cuda/blackwell-tuning-guide/", "description": "Tensor memory, Blackwell execution features, and architecture limits.", "id": "1-2-4"}], "notes": []}, {"title": "Compilation and machine code", "resources": [{"title": "NVCC Compiler Driver", "url": "https://docs.nvidia.com/cuda/cuda-compiler-driver-nvcc/", "description": "The CUDA compilation trajectory and artifact controls.", "id": "1-3-0"}, {"title": "PTX ISA", "url": "https://docs.nvidia.com/cuda/parallel-thread-execution/", "description": "NVIDIA's virtual instruction set and memory model.", "id": "1-3-1"}, {"title": "CUDA Binary Utilities", "url": "https://docs.nvidia.com/cuda/cuda-binary-utilities/", "description": "cuobjdump and nvdisasm for inspecting GPU binaries.", "id": "1-3-2"}, {"title": "Understanding PTX", "url": "https://developer.nvidia.com/blog/understanding-ptx-the-assembly-language-of-cuda-gpu-computing/", "description": "NVIDIA's introduction to the role of PTX between CUDA and machine code.", "id": "1-3-3"}], "notes": []}], "title": "GPU fundamentals", "label": "Chapter 01", "subtitle": "Think in threads. Reason in memory.", "intro": "A GPU needs enough independent work to keep its execution units busy. The programming model explains how work is grouped; the memory hierarchy explains why two implementations of the same calculation can have very different costs.", "sections": [{"title": "From a grid to a warp", "body": "CUDA launches a grid of thread blocks. Blocks execute on streaming multiprocessors, and threads are scheduled in warps. On NVIDIA CUDA GPUs, a warp contains 32 threads; this is not a universal width for all accelerators. Treat the warp as an important unit for reasoning about memory access and divergent control flow.", "sources": [{"title": "CUDA programming model", "url": "https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html"}]}, {"title": "Make data movement visible", "body": "Adjacent threads accessing adjacent addresses can use memory transactions efficiently. Strided access can require more transactions for the same useful bytes. Shared memory can help threads reuse data, but synchronization and bank conflicts introduce their own costs.", "sources": [{"title": "CUDA C++ Best Practices Guide", "url": "https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/"}]}, {"title": "Inspect what actually runs", "body": "Source code is one view of a kernel. The compiler pipeline and binary inspection tools expose another. Read the programming model first, then use the architecture tuning guide and generated machine code to explain the behavior you measure.", "sources": [{"title": "NVCC Compiler Driver", "url": "https://docs.nvidia.com/cuda/cuda-compiler-driver-nvcc/"}, {"title": "CUDA Binary Utilities", "url": "https://docs.nvidia.com/cuda/cuda-binary-utilities/"}]}], "exercise": "Use a transpose kernel as an exercise: predict its memory access pattern before looking at a profiler.", "labSources": [{"title": "CUDA C++ Best Practices Guide", "url": "https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/"}]}, {"originalTitle": "2. Kernel optimization", "groups": [{"title": "Foundational kernel exercises", "resources": [{"title": "Efficient Matrix Transpose in CUDA C/C++", "url": "https://developer.nvidia.com/blog/efficient-matrix-transpose-cuda-cc/", "description": "Coalescing, shared-memory tiling, and bank conflicts.", "id": "2-2-0"}, {"title": "Optimizing Parallel Reduction in CUDA", "url": "https://developer.download.nvidia.com/assets/cuda/files/reduction.pdf", "description": "Synchronization, divergence, occupancy, and instruction cost.", "id": "2-2-1"}, {"title": "Single-pass Parallel Prefix Scan with Decoupled Look-back", "url": "https://research.nvidia.com/sites/default/files/pubs/2016-03_Single-pass-Parallel-Prefix/nvr-2016-002.pdf", "description": "A work-efficient scan with one pass over memory.", "id": "2-2-2"}, {"title": "Online Normalizer Calculation for Softmax", "url": "https://arxiv.org/abs/1805.02867", "description": "Numerically stable online softmax without materialized intermediates.", "id": "2-2-3"}], "notes": []}, {"title": "Matrix multiplication", "resources": [{"title": "Benchmarking GPUs to Tune Dense Linear Algebra", "url": "https://mc.stanford.edu/cgi-bin/images/6/65/SC08_Volkov_GPU.pdf", "description": "The canonical case for reasoning from measured hardware behavior instead of occupancy alone.", "id": "2-3-0"}, {"title": "CUTLASS 3.x design", "url": "https://docs.nvidia.com/cutlass/latest/media/docs/cpp/cutlass_3x_design.html", "description": "The collective and kernel structure used by modern CUTLASS.", "id": "2-3-1"}, {"title": "DeepGEMM", "url": "https://github.com/deepseek-ai/DeepGEMM", "description": "A compact production FP8 GEMM implementation for Hopper.", "id": "2-3-2", "audit": {"label": "Snapshot context", "body": "The source describes the earlier Hopper FP8 implementation. The current repository has expanded to more data types and kernel families. Consult its version-specific requirements.", "url": "https://github.com/deepseek-ai/DeepGEMM", "link": "Current project scope"}}], "notes": []}, {"title": "Direct implementation work", "resources": [{"title": "How to Optimize a CUDA Matmul Kernel for cuBLAS-like Performance", "url": "https://siboehm.com/articles/22/CUDA-MMM", "description": "A matrix multiplication built from naive CUDA through shared-memory and register tiling.", "id": "2-4-0"}, {"title": "Inside NVIDIA GPUs: Anatomy of High-Performance Matmul Kernels", "url": "https://www.aleksagordic.com/blog/matmul", "description": "Layouts, tiling, PTX, machine code, and roofline analysis.", "id": "2-4-1"}, {"title": "Outperforming cuBLAS on H100: A Worklog", "url": "https://cudaforfun.substack.com/p/outperforming-cublas-on-h100-a-worklog", "description": "A direct Hopper optimization worklog using tensor cores and asynchronous movement.", "id": "2-4-2"}, {"title": "CUTLASS Tutorial: Mastering TMA", "url": "https://research.colfax-intl.com/tutorial-hopper-tma/", "description": "Working kernels built around the Tensor Memory Accelerator.", "id": "2-4-3"}], "notes": []}, {"title": "Tensor cores and low precision", "resources": [{"title": "OCP 8-bit Floating Point Specification", "url": "https://www.opencompute.org/documents/ocp-8-bit-floating-point-specification-ofp8-revision-1-1-final-pdf", "description": "E4M3 and E5M2 formats.", "id": "2-5-0"}, {"title": "OCP Microscaling Formats Specification", "url": "https://www.opencompute.org/documents/ocp-microscaling-formats-mx-v1-0-spec-final-pdf", "description": "Shared-scale MX formats.", "id": "2-5-1", "audit": {"label": "Source verified", "body": "The official 16-page MX v1.0 specification is now accessible. Sections 5.1–5.2 confirm shared block scales; its concrete formats use 32 elements and an 8-bit E8M0 scale. The original reading cue is supported. Memory layout and internal dot-product precision are implementation-defined.", "url": "https://www.opencompute.org/documents/ocp-microscaling-formats-mx-v1-0-spec-final-pdf#page=10", "link": "Specification §§5–6"}}, {"title": "NVIDIA Transformer Engine", "url": "https://github.com/NVIDIA/TransformerEngine", "description": "FP8 and FP4 transformer execution with scaling controls.", "id": "2-5-2"}, {"title": "Blackwell matrix multiply instructions", "url": "https://docs.nvidia.com/cutlass/latest/media/docs/pythonDSL/mma_docs/tcgen05_programming.html", "description": "tcgen05, tensor memory, and Blackwell MMA programming.", "id": "2-5-3", "audit": {"label": "Link correction", "body": "The original URL returned an empty document. Use the current NVIDIA tcgen05 MMA programming guide.", "url": "https://docs.nvidia.com/cutlass/latest/media/docs/pythonDSL/guides/mma/tcgen05_programming.html", "link": "Current programming guide"}}], "notes": []}, {"title": "Attention", "resources": [{"title": "FlashAttention", "url": "https://arxiv.org/abs/2205.14135", "description": "IO-aware exact attention.", "id": "2-6-0"}, {"title": "FlashAttention-2", "url": "https://arxiv.org/abs/2307.08691", "description": "Better work partitioning and parallelism.", "id": "2-6-1"}, {"title": "FlashAttention-3", "url": "https://arxiv.org/abs/2407.08608", "description": "Asynchronous movement and tensor-core overlap on Hopper.", "id": "2-6-2"}, {"title": "FlashAttention-4", "url": "https://proceedings.mlsys.org/paper_files/paper/2026/file/ae8b0b5838ba510daff1198474e7b984-Paper-Conference.pdf", "description": "The Blackwell attention schedule.", "id": "2-6-3"}, {"title": "FlashInfer", "url": "https://github.com/flashinfer-ai/flashinfer", "description": "Attention and related kernels for serving workloads.", "id": "2-6-4"}], "notes": []}], "title": "Kernel optimization", "label": "Chapter 02", "subtitle": "Move fewer bytes. Reuse more work.", "intro": "A fast kernel is designed around a workload and a machine. Start with a correct baseline, estimate the limiting resource, then change one mechanism at a time.", "sections": [{"title": "Use a ceiling, not a promise", "body": "The roofline model relates arithmetic intensity—floating-point operations per byte moved across a specified memory boundary—to bandwidth and compute ceilings. Its bound is min(peak compute, bandwidth × intensity). Use the same memory boundary, operation-counting convention, and precision throughout. The notebook uses a hypothetical device-memory boundary; a cache-level roofline would use different traffic and bandwidth. Scheduling, dependencies, instruction mix, and launch overhead can keep measured performance below this bound.", "sources": [{"title": "NERSC roofline guide", "url": "https://docs.nersc.gov/tools/performance/roofline/"}]}, {"title": "Tiling turns movement into reuse", "body": "Matrix multiplication is a useful laboratory: a tile brought into fast memory can serve several operations. Tile size, register pressure, synchronization, and parallel work must be balanced. The implementation worklogs below show that sequence of tradeoffs in code.", "sources": [{"title": "How to Optimize a CUDA Matmul Kernel for cuBLAS-like Performance", "url": "https://siboehm.com/articles/22/CUDA-MMM"}]}, {"title": "Keep the mathematical contract", "body": "Fusion can remove intermediate writes; attention kernels can restructure data movement. Lower precision changes numerical behavior, and reordering or fusing arithmetic can change rounding even at the same precision. Define the required accuracy, including tolerances and edge-case behavior. Check against a reference over representative shapes and difficult inputs before comparing speed; passing those checks establishes evidence for the tested cases.", "sources": [{"title": "FlashAttention", "url": "https://arxiv.org/abs/2205.14135"}, {"title": "CUDA C++ Best Practices Guide", "url": "https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/"}]}], "exercise": "In the model below, double intensity while memory-bound. Then repeat after reaching the compute ceiling. Explain the difference.", "labSources": [{"title": "NERSC roofline guide", "url": "https://docs.nersc.gov/tools/performance/roofline/"}]}, {"originalTitle": "3. Programming models and profiling", "groups": [{"title": "Triton", "resources": [{"title": "Triton paper", "url": "https://eecs.harvard.edu/~htk/publication/2019-mapl-tillet-kung-cox.pdf", "description": "The original blocked-program language and compiler design.", "id": "3-2-0"}, {"title": "Triton programming guide", "url": "https://triton-lang.org/main/programming-guide/chapter-1/introduction.html", "description": "The official programming model.", "id": "3-2-1"}, {"title": "Triton repository", "url": "https://github.com/triton-lang/triton", "description": "Compiler, examples, tests, and backend implementation.", "id": "3-2-2"}], "notes": []}, {"title": "CUTLASS, CuTe, and CUDA Tile", "resources": [{"title": "CuTe layout algebra", "url": "https://docs.nvidia.com/cutlass/latest/media/docs/cpp/cute/02_layout_algebra.html", "description": "Layouts and layout composition.", "id": "3-3-0"}, {"title": "CuTe GEMM tutorial", "url": "https://docs.nvidia.com/cutlass/latest/media/docs/cpp/cute/0x_gemm_tutorial.html", "description": "A GEMM expressed through CuTe layouts and atoms.", "id": "3-3-1"}, {"title": "CUTLASS pipeline documentation", "url": "https://docs.nvidia.com/cutlass/latest/media/docs/cpp/pipeline.html", "description": "Producer-consumer pipelines and asynchronous stages.", "id": "3-3-2"}, {"title": "CUDA Tile IR programming model", "url": "https://docs.nvidia.com/cuda/tile-ir/latest/sections/prog_model.html", "description": "NVIDIA's compiler-owned tile abstraction.", "id": "3-3-3"}, {"title": "CUDA Tile repository", "url": "https://github.com/NVIDIA/cuda-tile", "description": "The current implementation and examples.", "id": "3-3-4"}], "notes": []}, {"title": "Other hardware stacks", "resources": [{"title": "ROCm Composable Kernel", "url": "https://github.com/ROCm/composable_kernel", "description": "AMD tiling, layout, and operator primitives.", "id": "3-4-0", "audit": {"label": "Repository moved", "body": "The original repository is deprecated and maintained as a read-only mirror. Development moved into ROCm/rocm-libraries.", "url": "https://github.com/ROCm/rocm-libraries/tree/develop/projects/composablekernel", "link": "Current repository"}}, {"title": "ROCm AITER", "url": "https://github.com/ROCm/aiter", "description": "AMD inference and transformer operator implementations.", "id": "3-4-1"}, {"title": "HipKittens", "url": "https://github.com/HazyResearch/HipKittens", "description": "A tile abstraction for AMD GPUs.", "id": "3-4-2"}, {"title": "Pallas design", "url": "https://docs.jax.dev/en/latest/pallas/design/design.html", "description": "The JAX kernel model for GPU and TPU backends.", "id": "3-4-3"}, {"title": "NKI programming model", "url": "https://awsdocs-neuron.readthedocs-hosted.com/en/latest/nki/programming_model.html", "description": "The tile-level programming model for AWS NeuronCore hardware.", "id": "3-4-4"}], "notes": []}, {"title": "Profiling, benchmarking, and correctness", "resources": [{"title": "Nsight Systems User Guide", "url": "https://docs.nvidia.com/nsight-systems/UserGuide/", "description": "System timelines, CPU-GPU interaction, and distributed traces.", "id": "3-5-0"}, {"title": "Nsight Compute Profiling Guide", "url": "https://docs.nvidia.com/nsight-compute/ProfilingGuide/", "description": "Kernel metrics, sections, replay, and roofline analysis.", "id": "3-5-1"}, {"title": "Compute Sanitizer", "url": "https://docs.nvidia.com/compute-sanitizer/ComputeSanitizer/", "description": "Memory, race, initialization, and synchronization checks.", "id": "3-5-2"}, {"title": "CUTLASS GEMM measurement methodology", "url": "https://docs.nvidia.com/cutlass/latest/media/docs/cpp/gemm_performance_measurement_methodology_guidelines.html", "description": "Reproducible GEMM benchmarking.", "id": "3-5-3"}, {"title": "ROCm Compute Profiler", "url": "https://rocm.docs.amd.com/projects/rocprofiler-compute/en/latest/", "description": "AMD performance counters and roofline analysis.", "id": "3-5-4"}], "notes": []}], "title": "Programming & profiling", "label": "Chapter 03", "subtitle": "Let the trace choose your next move.", "intro": "Programming abstractions change how you express layouts, tiles, and pipelines. Profiling reveals whether those choices help the actual application.", "sections": [{"title": "Pick the level of control you need", "body": "Triton, CuTe, CUDA Tile, Pallas, and NKI expose different ways to express accelerator work. Begin with the model and examples for your target hardware. Choose a tool around the operation, integration requirements, and level of control you need.", "sources": [{"title": "Triton programming guide", "url": "https://triton-lang.org/main/programming-guide/chapter-1/introduction.html"}, {"title": "CuTe layout algebra", "url": "https://docs.nvidia.com/cutlass/latest/media/docs/cpp/cute/02_layout_algebra.html"}, {"title": "CUDA Tile IR programming model", "url": "https://docs.nvidia.com/cuda/tile-ir/latest/sections/prog_model.html"}, {"title": "Pallas design", "url": "https://docs.jax.dev/en/latest/pallas/design/design.html"}, {"title": "NKI programming model", "url": "https://awsdocs-neuron.readthedocs-hosted.com/en/latest/nki/programming_model.html"}]}, {"title": "Zoom in only after finding the cost", "body": "Start with a system timeline to locate idle periods, transfers, and work that delays completion. Correlate CPU activity, CUDA API calls, and GPU execution before choosing a kernel to optimize. A gap can reflect host work, synchronization, dependencies, or device scheduling; it does not identify the cause by itself. Consider both invocation frequency and the critical path when deciding which operation matters.", "sources": [{"title": "Nsight Systems User Guide", "url": "https://docs.nvidia.com/nsight-systems/UserGuide/"}, {"title": "Nsight Compute Profiling Guide", "url": "https://docs.nvidia.com/nsight-compute/ProfilingGuide/"}, {"title": "NVIDIA: interpreting timeline gaps", "url": "https://developer.nvidia.com/blog/understanding-the-visualization-of-overhead-and-latency-in-nsight-systems/"}]}, {"title": "Make experiments comparable", "body": "Record shapes, precision, hardware, software versions, warmup, synchronization, and timing method. Compare equivalent work and retain correctness checks. A profiler can perturb execution, so distinguish profiled measurements from normal benchmark runs.", "sources": [{"title": "CUTLASS GEMM measurement methodology", "url": "https://docs.nvidia.com/cutlass/latest/media/docs/cpp/gemm_performance_measurement_methodology_guidelines.html"}, {"title": "Nsight Compute Profiling Guide", "url": "https://docs.nvidia.com/nsight-compute/ProfilingGuide/"}]}], "exercise": "Write a benchmark record someone else could reproduce, including the reference implementation and correctness tolerance.", "labSources": [{"title": "Nsight Systems User Guide", "url": "https://docs.nvidia.com/nsight-systems/UserGuide/"}, {"title": "NVIDIA: interpreting timeline gaps", "url": "https://developer.nvidia.com/blog/understanding-the-visualization-of-overhead-and-latency-in-nsight-systems/"}]}, {"originalTitle": "4. Inference engines", "groups": [{"title": "Scheduling and continuous batching", "resources": [{"title": "Orca", "url": "https://www.usenix.org/conference/osdi22/presentation/yu", "description": "Iteration-level scheduling for autoregressive serving.", "id": "4-2-0"}, {"title": "PagedAttention and vLLM", "url": "https://arxiv.org/html/2309.06180", "description": "Paged KV allocation and continuous batching.", "id": "4-2-1"}, {"title": "Sarathi-Serve", "url": "https://www.usenix.org/system/files/osdi24-agrawal.pdf", "description": "Chunked prefills that reduce interference with decode.", "id": "4-2-2"}, {"title": "SGLang", "url": "https://arxiv.org/html/2312.07104", "description": "Prefix reuse, structured programs, and a serving runtime.", "id": "4-2-3"}, {"title": "vLLM", "url": "https://github.com/vllm-project/vllm", "description": "The main production engine implementations.", "id": "4-2-4"}, {"title": "SGLang", "url": "https://github.com/sgl-project/sglang", "description": "The main production engine implementations.", "id": "4-2-5"}, {"title": "TensorRT-LLM", "url": "https://github.com/NVIDIA/TensorRT-LLM", "description": "The main production engine implementations.", "id": "4-2-6"}], "notes": []}, {"title": "KV cache systems", "resources": [{"title": "Grouped-Query Attention", "url": "https://arxiv.org/abs/2305.13245", "description": "Fewer key-value heads and a smaller KV cache.", "id": "4-3-0"}, {"title": "DeepSeek-V2", "url": "https://arxiv.org/abs/2405.04434", "description": "Multi-head latent attention and compressed KV state.", "id": "4-3-1"}, {"title": "KIVI", "url": "https://proceedings.mlr.press/v235/liu24bz.html", "description": "KV quantization with separate treatment for keys and values.", "id": "4-3-2"}, {"title": "CacheGen", "url": "https://cs.stanford.edu/~keithw/sigcomm2024/sigcomm24-final1571-acmpaginated.pdf", "description": "KV compression for transfer.", "id": "4-3-3"}, {"title": "Mooncake", "url": "https://www.usenix.org/conference/fast25/presentation/qin", "description": "A distributed KV cache and data plane.", "id": "4-3-4"}], "notes": []}, {"title": "Quantization", "resources": [{"title": "GPTQ", "url": "https://arxiv.org/abs/2210.17323", "description": "One-shot second-order weight quantization.", "id": "4-4-0"}, {"title": "SmoothQuant", "url": "https://proceedings.mlr.press/v202/xiao23c.html", "description": "W8A8 execution by moving quantization difficulty from activations into weights.", "id": "4-4-1"}, {"title": "AWQ", "url": "https://proceedings.mlsys.org/paper_files/paper/2024/file/42a452cbafa9dd64e9ba4aa95cc1ef21-Paper-Conference.pdf", "description": "Low-bit weight-only inference with salient-weight protection.", "id": "4-4-2"}, {"title": "Introducing NVFP4 for Efficient and Accurate Low-Precision Inference", "url": "https://developer.nvidia.com/blog/introducing-nvfp4-for-efficient-and-accurate-low-precision-inference/", "description": "Hardware-native 4-bit micro-block scaling for Blackwell inference.", "id": "4-4-3"}], "notes": []}, {"title": "Speculative decoding", "resources": [{"title": "Fast Inference from Transformers via Speculative Decoding", "url": "https://proceedings.mlr.press/v202/leviathan23a.html", "description": "Exact sampling with a draft model.", "id": "4-5-0"}, {"title": "Accelerating Large Language Model Decoding with Speculative Sampling", "url": "https://arxiv.org/abs/2302.01318", "description": "The parallel formulation and analysis.", "id": "4-5-1"}, {"title": "Medusa", "url": "https://arxiv.org/html/2401.10774", "description": "Multiple prediction heads on the target model.", "id": "4-5-2"}, {"title": "EAGLE", "url": "https://proceedings.mlr.press/v235/li24bt.html", "description": "Feature-level drafting.", "id": "4-5-3"}], "notes": []}, {"title": "Structured decoding and fairness", "resources": [{"title": "Guiding LLMs the Right Way", "url": "https://proceedings.mlr.press/v235/beurer-kellner24a.html", "description": "Constrained decoding without changing the intended token distribution.", "id": "4-6-0", "audit": {"label": "Scope clarification", "body": "DOMINO addresses unnecessary restrictions caused by grammar/subword misalignment. Section 3.5 ties minimal intervention to sufficiently deep lookahead; shallow settings can exclude valid tokens. Enforcing the grammar still excludes invalid outputs. My interpretation: this is not a general guarantee of preserving the unconstrained or globally conditioned sequence distribution.", "url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/beurer-kellner24a/beurer-kellner24a.pdf", "link": "Original DOMINO paper"}}, {"title": "XGrammar", "url": "https://proceedings.mlsys.org/paper_files/paper/2025/file/5c20ca4b0b20b0bd2f1d839dc605e70f-Paper-Conference.pdf", "description": "A fast grammar engine for structured generation.", "id": "4-6-1"}, {"title": "Fairness in Serving Large Language Models", "url": "https://arxiv.org/html/2401.00588", "description": "Fair scheduling when request sizes are different and unknown.", "id": "4-6-2"}], "notes": []}, {"title": "Long context and multimodal inference", "resources": [{"title": "Ring Attention", "url": "https://arxiv.org/abs/2310.01889", "description": "Exact distributed attention by circulating KV blocks around a device ring.", "id": "4-7-0"}, {"title": "MInference 1.0", "url": "https://arxiv.org/abs/2407.02490", "description": "Dynamic sparse patterns for long-context prefill on existing models.", "id": "4-7-1"}, {"title": "Native Sparse Attention", "url": "https://arxiv.org/abs/2502.11089", "description": "A model trained with a hardware-aligned sparse attention hierarchy.", "id": "4-7-2"}, {"title": "vLLM multimodal inputs", "url": "https://docs.vllm.ai/en/latest/features/multimodal_inputs.html", "description": "Current engine support for text, image, audio, and video inputs.", "id": "4-7-3"}], "notes": []}], "title": "Inference engines", "label": "Chapter 04", "subtitle": "Turn fast kernels into a responsive service.", "intro": "An inference engine manages changing requests, memory, and execution. Its job is to keep useful work flowing while respecting the experience of each request.", "sections": [{"title": "Scheduling is part of performance", "body": "Continuous batching updates the active request set between iterations. Prompt work and generation compete for resources; chunking and scheduling policies influence latency as well as utilization. Compare engines using the same request distribution and service objectives.", "sources": [{"title": "Orca", "url": "https://www.usenix.org/conference/osdi22/presentation/yu"}, {"title": "Sarathi-Serve", "url": "https://www.usenix.org/system/files/osdi24-agrawal.pdf"}]}, {"title": "Budget the growing state", "body": "For a conventional dense KV cache, storage scales with cached tokens, layers, KV heads, head dimension, element size, and concurrent sequences. The calculator assumes equal-length sequences, identical dimensions across layers, and equally sized key and value entries. It estimates the total logical cache; per-device allocation depends on sharding and replication. Model weights, activations, metadata, and temporary workspaces require additional memory.", "sources": [{"title": "How to Scale Your Model: Inference", "url": "https://jax-ml.github.io/scaling-book/inference/"}]}, {"title": "Different mechanisms solve different costs", "body": "Grouped-query attention shares KV heads among query heads, reducing the cache relative to standard multi-head attention with one KV head per query head. Quantization changes representation. Reusing an available, compatible prefix cache skips repeated prefill work for matching prefixes; it does not eliminate subsequent decoding. Speculative decoding proposes tokens and verifies them with the target model. Its distribution-preserving variants require the specified acceptance and correction algorithm. Evaluate these mechanisms under the model and workload you intend to serve.", "sources": [{"title": "Grouped-Query Attention", "url": "https://arxiv.org/abs/2305.13245"}, {"title": "SGLang", "url": "https://arxiv.org/html/2312.07104"}, {"title": "Fast Inference from Transformers via Speculative Decoding", "url": "https://proceedings.mlr.press/v202/leviathan23a.html"}, {"title": "vLLM: prefix caching and its limits", "url": "https://docs.vllm.ai/en/latest/features/automatic_prefix_caching/"}]}], "exercise": "Double context length, then halve KV heads. Observe the cache size and explain why model weights are absent from this estimate.", "labSources": [{"title": "How to Scale Your Model: Inference", "url": "https://jax-ml.github.io/scaling-book/inference/"}]}, {"originalTitle": "5. Distributed inference", "groups": [{"title": "Parallelism, collectives, and topology", "resources": [{"title": "Megatron-LM", "url": "https://arxiv.org/abs/1909.08053", "description": "Tensor and pipeline parallelism for transformer models.", "id": "5-2-0", "audit": {"label": "Scope clarification", "body": "The linked 2019 paper introduces intra-layer (tensor) parallelism and describes it as complementary to pipeline parallelism. The 2021 paper covers their composition with data parallelism.", "url": "https://arxiv.org/abs/2104.04473", "link": "Megatron-LM: combined parallelism (2021)"}}, {"title": "NCCL", "url": "https://github.com/NVIDIA/nccl", "description": "NVIDIA's collective communication implementation.", "id": "5-2-1"}, {"title": "Multi-node NVLink Systems Tuning Guide", "url": "https://docs.nvidia.com/multi-node-nvlink-systems/multi-node-tuning-guide/", "description": "NVLink and InfiniBand topology in GB200 NVL systems.", "id": "5-2-2"}, {"title": "UALink 1.0 Specification", "url": "https://ualinkconsortium.org/wp-content/uploads/2025/04/UALink200_Specification_v1.0_Evaluation_Copy.pdf", "description": "An open scale-up interconnect.", "id": "5-2-3"}, {"title": "Ultra Ethernet 1.0.3 Specification", "url": "https://ultraethernet.org/wp-content/uploads/sites/20/2026/08/UE-Specification-1.0.3.pdf", "description": "The scale-out transport specification.", "id": "5-2-4"}], "notes": []}, {"title": "Mixture-of-experts serving", "resources": [{"title": "DeepSeek-V3", "url": "https://arxiv.org/html/2412.19437", "description": "Routed experts, shared experts, and the model-system design.", "id": "5-3-0"}, {"title": "DeepEP", "url": "https://github.com/deepseek-ai/DeepEP", "description": "Expert dispatch and combine kernels.", "id": "5-3-1"}, {"title": "EPLB", "url": "https://github.com/deepseek-ai/EPLB", "description": "Expert placement and replication from measured load.", "id": "5-3-2"}, {"title": "MegaScale-Infer", "url": "https://arxiv.org/abs/2504.02263", "description": "Large-scale MoE inference and communication overlap.", "id": "5-3-3"}], "notes": []}, {"title": "Prefill and decode disaggregation", "resources": [{"title": "DistServe", "url": "https://arxiv.org/html/2401.09670", "description": "Separate prefill and decode workers optimized for goodput under latency constraints.", "id": "5-4-0"}, {"title": "Splitwise", "url": "https://www.microsoft.com/en-us/research/publication/splitwise-efficient-generative-llm-inference-using-phase-splitting/", "description": "Phase-specific allocation and scheduling.", "id": "5-4-1"}, {"title": "Mooncake", "url": "https://www.usenix.org/conference/fast25/presentation/qin", "description": "KV-centric disaggregated inference.", "id": "5-4-2"}, {"title": "NIXL", "url": "https://github.com/ai-dynamo/nixl", "description": "A transport layer for moving inference state across memory and network backends.", "id": "5-4-3"}, {"title": "Dynamo disaggregated serving", "url": "https://docs.nvidia.com/dynamo/design-docs/disaggregated-serving.md", "description": "A current production implementation.", "id": "5-4-4", "audit": {"label": "Link correction", "body": "The original URL redirects to a Page Not Found document despite returning HTTP 200. Use the current NVIDIA design document.", "url": "https://docs.nvidia.com/dynamo/dev/knowledge-base/concepts/system-architecture/disaggregated-serving", "link": "Current design document"}}], "notes": []}, {"title": "Production systems", "resources": [{"title": "Clockwork", "url": "https://www.usenix.org/conference/osdi20/presentation/gujarati", "description": "Predictable model serving through centralized scheduling.", "id": "5-5-0"}, {"title": "ServerlessLLM", "url": "https://www.usenix.org/conference/osdi24/presentation/fu", "description": "Faster model startup and live migration.", "id": "5-5-1"}, {"title": "Gateway API Inference Extension", "url": "https://gateway-api-inference-extension.sigs.k8s.io/", "description": "Model, accelerator, and KV-aware request routing.", "id": "5-5-2"}, {"title": "llm-d", "url": "https://github.com/llm-d/llm-d", "description": "Distributed routing, scheduling, and disaggregated serving on Kubernetes.", "id": "5-5-3"}], "notes": []}, {"title": "Serving benchmarks", "resources": [{"title": "MLPerf Inference", "url": "https://www.cs.toronto.edu/ecosystem/papers/ISCA_20/MLPerf%20Inference.pdf", "description": "Reproducible benchmark scenarios and load generation.", "id": "5-6-0"}, {"title": "Etalon", "url": "https://arxiv.org/html/2407.07000", "description": "Goodput under per-request latency SLOs.", "id": "5-6-1", "audit": {"label": "Metric clarification", "body": "Etalon’s central contribution is fluidity-index and fluid token generation rate. Average TPOT alone can hide stalls; the source description is a brief reading cue, not a complete summary.", "url": "https://arxiv.org/html/2407.07000", "link": "Metric definitions"}}, {"title": "ServeGen", "url": "https://www.usenix.org/system/files/nsdi26-xiang-servegen.pdf", "description": "Workload generation that preserves important production-trace properties.", "id": "5-6-2"}, {"title": "BurstGPT", "url": "https://github.com/HPMLL/BurstGPT", "description": "A public trace for bursty LLM workloads.", "id": "5-6-3"}, {"title": "MLPerf Endpoints", "url": "https://mlcommons.org/benchmarks/endpoints/", "description": "An endpoint-level benchmark for interactive generative AI.", "id": "5-6-4"}], "notes": []}], "title": "Distributed inference", "label": "Chapter 05", "subtitle": "Every partition creates a communication bill.", "intro": "When work spans devices, local kernel speed becomes one part of a larger system. Placement, interconnects, scheduling, and state transfer all enter the budget.", "sections": [{"title": "Partition around the workload", "body": "Tensor parallelism partitions computations within layers across devices; pipeline parallelism assigns groups of layers to stages. Expert parallelism places different experts on different devices, and routed tokens move to the devices holding their selected experts. Each choice changes communication and load balance. Read the algorithm alongside the collective implementation and physical topology.", "sources": [{"title": "Megatron-LM: combined parallelism (2021)", "url": "https://arxiv.org/abs/2104.04473"}, {"title": "DeepSeek-V3", "url": "https://arxiv.org/html/2412.19437"}]}, {"title": "Separate phases deliberately", "body": "Prefill and decode disaggregation lets workers specialize, but KV state has to move between them. A useful comparison accounts for transfer cost, queueing, utilization, and tail latency. More devices alone do not establish a better system.", "sources": [{"title": "DistServe", "url": "https://arxiv.org/html/2401.09670"}, {"title": "Splitwise", "url": "https://www.microsoft.com/en-us/research/publication/splitwise-efficient-generative-llm-inference-using-phase-splitting/"}]}, {"title": "Measure the complete service", "body": "Production traces include burstiness and varied request sizes. Use a workload generator that captures the behavior relevant to your service. Report latency distributions and goodput alongside aggregate token throughput.", "sources": [{"title": "ServeGen", "url": "https://www.usenix.org/system/files/nsdi26-xiang-servegen.pdf"}, {"title": "Etalon", "url": "https://arxiv.org/html/2407.07000"}]}], "exercise": "Use the scaling model to see why adding workers cannot eliminate a serial fraction. List the communication costs the model leaves out.", "labSources": [{"title": "LLNL parallel computing tutorial", "url": "https://hpc.llnl.gov/documentation/tutorials/introduction-parallel-computing-tutorial"}]}, {"originalTitle": "6. Current hardware", "groups": [{"title": "NVIDIA", "resources": [{"title": "Blackwell architecture brief", "url": "https://resources.nvidia.com/en-us-blackwell-architecture/blackwell-architecture-technical-brief", "description": "Blackwell and Blackwell Ultra system architecture.", "id": "6-2-0"}, {"title": "Blackwell Tuning Guide", "url": "https://docs.nvidia.com/cuda/blackwell-tuning-guide/", "description": "Programming and optimization guidance.", "id": "6-2-1"}, {"title": "CUTLASS Blackwell documentation", "url": "https://docs.nvidia.com/cutlass/latest/media/docs/cpp/blackwell.html", "description": "Blackwell matrix multiply and data-movement support.", "id": "6-2-2"}], "notes": []}, {"title": "AMD", "resources": [{"title": "CDNA 4 architecture whitepaper", "url": "https://www.amd.com/content/dam/amd/en/documents/instinct-tech-docs/white-papers/amd-cdna-4-architecture-whitepaper.pdf", "description": "MI350 compute, memory, and chiplet architecture.", "id": "6-3-0"}, {"title": "CDNA 4 instruction set", "url": "https://www.amd.com/content/dam/amd/en/documents/instinct-tech-docs/instruction-set-architectures/amd-instinct-cdna4-instruction-set-architecture.pdf", "description": "The native machine instruction reference.", "id": "6-3-1"}, {"title": "MI350 performance counters", "url": "https://rocm.docs.amd.com/en/latest/reference/gpu-arch/mi350-performance-counters.html", "description": "Counter definitions and measurement guidance.", "id": "6-3-2"}], "notes": []}, {"title": "Google TPU", "resources": [{"title": "TPU v1 analysis", "url": "https://research.google/pubs/in-datacenter-performance-analysis-of-a-tensor-processing-unit/", "description": "The original datacenter TPU paper.", "id": "6-4-0"}, {"title": "TPU v4", "url": "https://arxiv.org/abs/2304.01433", "description": "The TPU v4 chip, interconnect, and system.", "id": "6-4-1"}, {"title": "Ironwood documentation", "url": "https://docs.cloud.google.com/tpu/docs/tpu7x", "description": "Current TPU v7 architecture and configuration.", "id": "6-4-2"}, {"title": "Pallas TPU hardware model", "url": "https://docs.jax.dev/en/latest/pallas/tpu/hardware.html", "description": "The TPU execution and memory model for kernel authors.", "id": "6-4-3"}], "notes": []}, {"title": "AWS Trainium", "resources": [{"title": "Trainium and Inferentia2 architecture", "url": "https://awsdocs-neuron.readthedocs-hosted.com/en/latest/nki/guides/architecture/trainium_inferentia2_arch.html", "description": "NeuronCore v2 compute and memory architecture.", "id": "6-5-0"}, {"title": "Trainium3 architecture", "url": "https://awsdocs-neuron.readthedocs-hosted.com/en/latest/nki/guides/architecture/trainium3_arch.html", "description": "The current NeuronCore architecture.", "id": "6-5-1"}, {"title": "NKI performance guide", "url": "https://awsdocs-neuron.readthedocs-hosted.com/en/v2.24.0/general/nki/nki_perf_guide.html", "description": "Kernel optimization for Trainium and Inferentia.", "id": "6-5-2"}], "notes": []}], "title": "Hardware landscape", "label": "Chapter 06", "subtitle": "Read the architecture behind the headline.", "intro": "The repository groups NVIDIA, AMD, Google TPU, and AWS Trainium references. Use this chapter as a map to the documents, not a ranking of advertised peak numbers.", "sections": [{"title": "Compare equivalent operations", "body": "Precision, sparsity assumptions, supported shapes, and accumulator formats can change the meaning of a peak number. Before comparing devices, write down the exact operation and data representation your application uses.", "sources": [{"title": "Blackwell Tuning Guide", "url": "https://docs.nvidia.com/cuda/blackwell-tuning-guide/"}, {"title": "CDNA 4 architecture whitepaper", "url": "https://www.amd.com/content/dam/amd/en/documents/instinct-tech-docs/white-papers/amd-cdna-4-architecture-whitepaper.pdf"}, {"title": "Blackwell technical brief: dense/sparse performance tables", "url": "https://resources.nvidia.com/en-us-blackwell-architecture/blackwell-architecture-technical-brief"}]}, {"title": "Pair architecture with implementation", "body": "An architecture brief describes the machine. An ISA, tuning guide, or kernel programming model explains how software reaches it. Read both, then find an implementation and a reproducible workload that matter for your use case.", "sources": [{"title": "CUDA Programming Guide", "url": "https://docs.nvidia.com/cuda/cuda-programming-guide/"}, {"title": "Trainium3 architecture", "url": "https://awsdocs-neuron.readthedocs-hosted.com/en/latest/nki/guides/architecture/trainium3_arch.html"}]}, {"title": "Keep the snapshot in view", "body": "Hardware documentation and toolchains evolve. The resources below preserve the repository snapshot used for this edition; linked vendor documentation may change. Confirm supported features and software versions against the target environment before applying a result.", "sources": [{"title": "Original hardware collection", "url": "https://github.com/wafer-ai/gpu-perf-engineering-resources/blob/1c52412c3e36b678b43bc414522a790a8cb0212c/README.md#6-current-hardware"}]}], "exercise": "Choose one accelerator family below. Pair its architecture reference with a programming or tuning guide and identify a measurable hypothesis.", "labSources": [{"title": "Blackwell Tuning Guide", "url": "https://docs.nvidia.com/cuda/blackwell-tuning-guide/"}]}, {"originalTitle": "Frontier", "groups": [{"title": "AI-generated kernels", "resources": [{"title": "KernelBench", "url": "https://proceedings.mlr.press/v267/ouyang25a.html", "description": "The original benchmark for converting PyTorch operators into faster GPU kernels.", "id": "7-2-0"}, {"title": "KernelBench-Verified", "url": "https://arxiv.org/html/2607.16241", "description": "Stronger correctness tests and baseline parity.", "id": "7-2-1"}, {"title": "SOL-ExecBench", "url": "https://github.com/nvidia/sol-execbench", "description": "Correctness and performance measured against a hardware speed-of-light model.", "id": "7-2-2"}], "notes": []}, {"title": "Watchlist", "resources": [{"title": "NVIDIA Rubin", "url": "https://developer.nvidia.com/blog/inside-nvidia-rubin-gpu-architecture-powering-the-era-of-agentic-ai/", "description": "", "id": "7-3-0"}], "notes": ["NVIDIA Rubin and Rubin CPX, pending shipped systems and reproducible measurements.", "AMD MI400, CDNA 5, and Helios, pending architecture and ISA documents.", "Session-aware and agentic scheduling against public production traces.", "Real-time voice and video serving with complete quality and latency metrics.", "Inference ASICs, processing in memory, analog compute, and photonic compute with reproducible deployments.", "Individual AI kernel agents that have not been rerun on a hardened evaluator."]}], "title": "The frontier", "label": "Chapter 07", "subtitle": "Be curious. Demand reproducible evidence.", "intro": "AI-generated kernels and emerging architectures move quickly. The source repository deliberately keeps this material separate from the core reading path.", "sections": [{"title": "A generated kernel still needs a contract", "body": "Define supported shapes, dtypes, layouts, tolerances, and edge cases before measuring. A speedup on one input is a result for that input. General claims require broader tests and an equivalent baseline.", "sources": [{"title": "KernelBench", "url": "https://proceedings.mlr.press/v267/ouyang25a.html"}]}, {"title": "Evaluate the evaluator", "body": "A benchmark should make it difficult to pass by exploiting the test. Look for varied correctness checks, equivalent baselines, and enough environmental detail to reproduce timing. Passing a finite test suite supports the tested cases; it does not prove correctness for every permitted input. Treat hardware speed-of-light estimates as analytical ceilings under their stated assumptions.", "sources": [{"title": "KernelBench-Verified", "url": "https://arxiv.org/html/2607.16241"}, {"title": "SOL-ExecBench", "url": "https://github.com/nvidia/sol-execbench"}]}, {"title": "Keep a watchlist, not a leaderboard", "body": "The repository labels this section as verified on 23 August 2026. Its watchlist records open evidence requirements, including shipped systems, architecture documents, public traces, and reproducible deployments. This book preserves that date rather than implying a new verification.", "sources": [{"title": "Original frontier snapshot", "url": "https://github.com/wafer-ai/gpu-perf-engineering-resources/blob/1c52412c3e36b678b43bc414522a790a8cb0212c/README.md#frontier"}]}], "exercise": "For a reported speedup, identify the hardware, workload, precision, baseline, and correctness method. Which missing detail would stop you from using it?", "labSources": [{"title": "KernelBench-Verified", "url": "https://arxiv.org/html/2607.16241"}]}], "commit": "1c52412c3e36b678b43bc414522a790a8cb0212c", "resourceCount": 123, "originalReadme": "<p align=\"center\">\n  <img src=\"cover.avif\" alt=\"AI Performance Engineering\" width=\"100%\">\n<\/p>\n\n# AI Performance Engineering\n\nA curated resource list for learning GPU performance engineering and production inference.\n\nThe list is ordered from a single inference request to a single GPU, optimized kernels, inference engines, and distributed systems. Read **Start here** first. After that, use it as a reference.\n\nThe core list uses original papers, official specifications and documentation, creator repositories, and direct implementation work.\n\nIf you work on these problems, [Wafer is hiring](https://wafer.ai).\n\n## Contents\n\n- [Start here: the minimum mental model](#start-here-the-minimum-mental-model)\n- [1. GPU fundamentals](#1-gpu-fundamentals)\n  - [Programming model](#programming-model)\n  - [Compilation and machine code](#compilation-and-machine-code)\n- [2. Kernel optimization](#2-kernel-optimization)\n  - [Foundational kernel exercises](#foundational-kernel-exercises)\n  - [Matrix multiplication](#matrix-multiplication)\n  - [Direct implementation work](#direct-implementation-work)\n  - [Tensor cores and low precision](#tensor-cores-and-low-precision)\n  - [Attention](#attention)\n- [3. Programming models and profiling](#3-programming-models-and-profiling)\n  - [Triton](#triton)\n  - [CUTLASS, CuTe, and CUDA Tile](#cutlass-cute-and-cuda-tile)\n  - [Other hardware stacks](#other-hardware-stacks)\n  - [Profiling, benchmarking, and correctness](#profiling-benchmarking-and-correctness)\n- [4. Inference engines](#4-inference-engines)\n  - [Scheduling and continuous batching](#scheduling-and-continuous-batching)\n  - [KV cache systems](#kv-cache-systems)\n  - [Quantization](#quantization)\n  - [Speculative decoding](#speculative-decoding)\n  - [Structured decoding and fairness](#structured-decoding-and-fairness)\n  - [Long context and multimodal inference](#long-context-and-multimodal-inference)\n- [5. Distributed inference](#5-distributed-inference)\n  - [Parallelism, collectives, and topology](#parallelism-collectives-and-topology)\n  - [Mixture-of-experts serving](#mixture-of-experts-serving)\n  - [Prefill and decode disaggregation](#prefill-and-decode-disaggregation)\n  - [Production systems](#production-systems)\n  - [Serving benchmarks](#serving-benchmarks)\n- [6. Current hardware](#6-current-hardware)\n  - [NVIDIA](#nvidia)\n  - [AMD](#amd)\n  - [Google TPU](#google-tpu)\n  - [AWS Trainium](#aws-trainium)\n- [Frontier](#frontier)\n  - [AI-generated kernels](#ai-generated-kernels)\n  - [Watchlist](#watchlist)\n- [Source policy](#source-policy)\n\n## Start here: the minimum mental model\n\nRead these in order if you are new to the field.\n\n1. [How to Scale Your Model: Inference](https://jax-ml.github.io/scaling-book/inference/) - One request from prefill through decode, with batching, KV memory, and parallelism.\n2. [Attention Is All You Need](https://arxiv.org/abs/1706.03762) - The transformer computation that the rest of the list optimizes.\n3. [CUDA C++ basics](https://docs.nvidia.com/cuda/cuda-programming-guide/02-basics/intro-to-cuda-cpp.html) - The shortest official introduction to the CUDA execution model.\n4. [Programming Massively Parallel Processors](https://www.elsevier.com/books/programming-massively-parallel-processors/hwu/978-0-323-91231-0) - The main textbook for GPU programming, memory, and kernel design.\n5. [Roofline: An Insightful Visual Performance Model](https://users.cs.duke.edu/~lkw34/papers/roofline-cacm2008.pdf) - The compute, memory-bandwidth, and arithmetic-intensity model.\n6. [Transformer Inference Arithmetic](https://kipply.github.io/blog/transformer-inference-arithmetic/) - FLOPs, parameter bytes, KV bytes, and communication for transformer inference.\n7. [Efficiently Scaling Transformer Inference](https://proceedings.mlsys.org/paper_files/paper/2023/file/c4be71ab8d24cdfb45e3d06dbfca2780-Paper-mlsys2023.pdf) - Latency, memory, and parallelism costs for large-model inference.\n8. [Etalon](https://arxiv.org/html/2407.07000) - TTFT, TPOT, goodput, and latency SLOs for generative-model serving.\n\nFor a practical companion, use the [GPU Mode lectures](https://github.com/gpu-mode/lectures).\n\n## 1. GPU fundamentals\n\n### Programming model\n\n- [CUDA Programming Guide](https://docs.nvidia.com/cuda/cuda-programming-guide/) - The normative CUDA reference.\n- [CUDA programming model](https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html) - Threads, warps, blocks, grids, and the memory hierarchy.\n- [CUDA C++ Best Practices Guide](https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/) - Coalescing, shared memory, occupancy, synchronization, and optimization workflow.\n- [Hopper Tuning Guide](https://docs.nvidia.com/cuda/hopper-tuning-guide/) - TMA, thread-block clusters, asynchronous execution, and Hopper-specific limits.\n- [Blackwell Tuning Guide](https://docs.nvidia.com/cuda/blackwell-tuning-guide/) - Tensor memory, Blackwell execution features, and architecture limits.\n\n### Compilation and machine code\n\n- [NVCC Compiler Driver](https://docs.nvidia.com/cuda/cuda-compiler-driver-nvcc/) - The CUDA compilation trajectory and artifact controls.\n- [PTX ISA](https://docs.nvidia.com/cuda/parallel-thread-execution/) - NVIDIA's virtual instruction set and memory model.\n- [CUDA Binary Utilities](https://docs.nvidia.com/cuda/cuda-binary-utilities/) - `cuobjdump` and `nvdisasm` for inspecting GPU binaries.\n- [Understanding PTX](https://developer.nvidia.com/blog/understanding-ptx-the-assembly-language-of-cuda-gpu-computing/) - NVIDIA's introduction to the role of PTX between CUDA and machine code.\n\n## 2. Kernel optimization\n\n### Foundational kernel exercises\n\n- [Efficient Matrix Transpose in CUDA C/C++](https://developer.nvidia.com/blog/efficient-matrix-transpose-cuda-cc/) - Coalescing, shared-memory tiling, and bank conflicts.\n- [Optimizing Parallel Reduction in CUDA](https://developer.download.nvidia.com/assets/cuda/files/reduction.pdf) - Synchronization, divergence, occupancy, and instruction cost.\n- [Single-pass Parallel Prefix Scan with Decoupled Look-back](https://research.nvidia.com/sites/default/files/pubs/2016-03_Single-pass-Parallel-Prefix/nvr-2016-002.pdf) - A work-efficient scan with one pass over memory.\n- [Online Normalizer Calculation for Softmax](https://arxiv.org/abs/1805.02867) - Numerically stable online softmax without materialized intermediates.\n\n### Matrix multiplication\n\n- [Benchmarking GPUs to Tune Dense Linear Algebra](https://mc.stanford.edu/cgi-bin/images/6/65/SC08_Volkov_GPU.pdf) - The canonical case for reasoning from measured hardware behavior instead of occupancy alone.\n- [CUTLASS 3.x design](https://docs.nvidia.com/cutlass/latest/media/docs/cpp/cutlass_3x_design.html) - The collective and kernel structure used by modern CUTLASS.\n- [DeepGEMM](https://github.com/deepseek-ai/DeepGEMM) - A compact production FP8 GEMM implementation for Hopper.\n\n### Direct implementation work\n\n- [How to Optimize a CUDA Matmul Kernel for cuBLAS-like Performance](https://siboehm.com/articles/22/CUDA-MMM) - A matrix multiplication built from naive CUDA through shared-memory and register tiling.\n- [Inside NVIDIA GPUs: Anatomy of High-Performance Matmul Kernels](https://www.aleksagordic.com/blog/matmul) - Layouts, tiling, PTX, machine code, and roofline analysis.\n- [Outperforming cuBLAS on H100: A Worklog](https://cudaforfun.substack.com/p/outperforming-cublas-on-h100-a-worklog) - A direct Hopper optimization worklog using tensor cores and asynchronous movement.\n- [CUTLASS Tutorial: Mastering TMA](https://research.colfax-intl.com/tutorial-hopper-tma/) - Working kernels built around the Tensor Memory Accelerator.\n\n### Tensor cores and low precision\n\n- [OCP 8-bit Floating Point Specification](https://www.opencompute.org/documents/ocp-8-bit-floating-point-specification-ofp8-revision-1-1-final-pdf) - E4M3 and E5M2 formats.\n- [OCP Microscaling Formats Specification](https://www.opencompute.org/documents/ocp-microscaling-formats-mx-v1-0-spec-final-pdf) - Shared-scale MX formats.\n- [NVIDIA Transformer Engine](https://github.com/NVIDIA/TransformerEngine) - FP8 and FP4 transformer execution with scaling controls.\n- [Blackwell matrix multiply instructions](https://docs.nvidia.com/cutlass/latest/media/docs/pythonDSL/mma_docs/tcgen05_programming.html) - `tcgen05`, tensor memory, and Blackwell MMA programming.\n\n### Attention\n\n- [FlashAttention](https://arxiv.org/abs/2205.14135) - IO-aware exact attention.\n- [FlashAttention-2](https://arxiv.org/abs/2307.08691) - Better work partitioning and parallelism.\n- [FlashAttention-3](https://arxiv.org/abs/2407.08608) - Asynchronous movement and tensor-core overlap on Hopper.\n- [FlashAttention-4](https://proceedings.mlsys.org/paper_files/paper/2026/file/ae8b0b5838ba510daff1198474e7b984-Paper-Conference.pdf) - The Blackwell attention schedule.\n- [FlashInfer](https://github.com/flashinfer-ai/flashinfer) - Attention and related kernels for serving workloads.\n\n## 3. Programming models and profiling\n\n### Triton\n\n- [Triton paper](https://eecs.harvard.edu/~htk/publication/2019-mapl-tillet-kung-cox.pdf) - The original blocked-program language and compiler design.\n- [Triton programming guide](https://triton-lang.org/main/programming-guide/chapter-1/introduction.html) - The official programming model.\n- [Triton repository](https://github.com/triton-lang/triton) - Compiler, examples, tests, and backend implementation.\n\n### CUTLASS, CuTe, and CUDA Tile\n\n- [CuTe layout algebra](https://docs.nvidia.com/cutlass/latest/media/docs/cpp/cute/02_layout_algebra.html) - Layouts and layout composition.\n- [CuTe GEMM tutorial](https://docs.nvidia.com/cutlass/latest/media/docs/cpp/cute/0x_gemm_tutorial.html) - A GEMM expressed through CuTe layouts and atoms.\n- [CUTLASS pipeline documentation](https://docs.nvidia.com/cutlass/latest/media/docs/cpp/pipeline.html) - Producer-consumer pipelines and asynchronous stages.\n- [CUDA Tile IR programming model](https://docs.nvidia.com/cuda/tile-ir/latest/sections/prog_model.html) - NVIDIA's compiler-owned tile abstraction.\n- [CUDA Tile repository](https://github.com/NVIDIA/cuda-tile) - The current implementation and examples.\n\n### Other hardware stacks\n\n- [ROCm Composable Kernel](https://github.com/ROCm/composable_kernel) - AMD tiling, layout, and operator primitives.\n- [ROCm AITER](https://github.com/ROCm/aiter) - AMD inference and transformer operator implementations.\n- [HipKittens](https://github.com/HazyResearch/HipKittens) - A tile abstraction for AMD GPUs.\n- [Pallas design](https://docs.jax.dev/en/latest/pallas/design/design.html) - The JAX kernel model for GPU and TPU backends.\n- [NKI programming model](https://awsdocs-neuron.readthedocs-hosted.com/en/latest/nki/programming_model.html) - The tile-level programming model for AWS NeuronCore hardware.\n\n### Profiling, benchmarking, and correctness\n\n- [Nsight Systems User Guide](https://docs.nvidia.com/nsight-systems/UserGuide/) - System timelines, CPU-GPU interaction, and distributed traces.\n- [Nsight Compute Profiling Guide](https://docs.nvidia.com/nsight-compute/ProfilingGuide/) - Kernel metrics, sections, replay, and roofline analysis.\n- [Compute Sanitizer](https://docs.nvidia.com/compute-sanitizer/ComputeSanitizer/) - Memory, race, initialization, and synchronization checks.\n- [CUTLASS GEMM measurement methodology](https://docs.nvidia.com/cutlass/latest/media/docs/cpp/gemm_performance_measurement_methodology_guidelines.html) - Reproducible GEMM benchmarking.\n- [ROCm Compute Profiler](https://rocm.docs.amd.com/projects/rocprofiler-compute/en/latest/) - AMD performance counters and roofline analysis.\n\n## 4. Inference engines\n\n### Scheduling and continuous batching\n\n- [Orca](https://www.usenix.org/conference/osdi22/presentation/yu) - Iteration-level scheduling for autoregressive serving.\n- [PagedAttention and vLLM](https://arxiv.org/html/2309.06180) - Paged KV allocation and continuous batching.\n- [Sarathi-Serve](https://www.usenix.org/system/files/osdi24-agrawal.pdf) - Chunked prefills that reduce interference with decode.\n- [SGLang](https://arxiv.org/html/2312.07104) - Prefix reuse, structured programs, and a serving runtime.\n- [vLLM](https://github.com/vllm-project/vllm), [SGLang](https://github.com/sgl-project/sglang), and [TensorRT-LLM](https://github.com/NVIDIA/TensorRT-LLM) - The main production engine implementations.\n\n### KV cache systems\n\n- [Grouped-Query Attention](https://arxiv.org/abs/2305.13245) - Fewer key-value heads and a smaller KV cache.\n- [DeepSeek-V2](https://arxiv.org/abs/2405.04434) - Multi-head latent attention and compressed KV state.\n- [KIVI](https://proceedings.mlr.press/v235/liu24bz.html) - KV quantization with separate treatment for keys and values.\n- [CacheGen](https://cs.stanford.edu/~keithw/sigcomm2024/sigcomm24-final1571-acmpaginated.pdf) - KV compression for transfer.\n- [Mooncake](https://www.usenix.org/conference/fast25/presentation/qin) - A distributed KV cache and data plane.\n\n### Quantization\n\n- [GPTQ](https://arxiv.org/abs/2210.17323) - One-shot second-order weight quantization.\n- [SmoothQuant](https://proceedings.mlr.press/v202/xiao23c.html) - W8A8 execution by moving quantization difficulty from activations into weights.\n- [AWQ](https://proceedings.mlsys.org/paper_files/paper/2024/file/42a452cbafa9dd64e9ba4aa95cc1ef21-Paper-Conference.pdf) - Low-bit weight-only inference with salient-weight protection.\n- [Introducing NVFP4 for Efficient and Accurate Low-Precision Inference](https://developer.nvidia.com/blog/introducing-nvfp4-for-efficient-and-accurate-low-precision-inference/) - Hardware-native 4-bit micro-block scaling for Blackwell inference.\n\n### Speculative decoding\n\n- [Fast Inference from Transformers via Speculative Decoding](https://proceedings.mlr.press/v202/leviathan23a.html) - Exact sampling with a draft model.\n- [Accelerating Large Language Model Decoding with Speculative Sampling](https://arxiv.org/abs/2302.01318) - The parallel formulation and analysis.\n- [Medusa](https://arxiv.org/html/2401.10774) - Multiple prediction heads on the target model.\n- [EAGLE](https://proceedings.mlr.press/v235/li24bt.html) - Feature-level drafting.\n\n### Structured decoding and fairness\n\n- [Guiding LLMs the Right Way](https://proceedings.mlr.press/v235/beurer-kellner24a.html) - Constrained decoding without changing the intended token distribution.\n- [XGrammar](https://proceedings.mlsys.org/paper_files/paper/2025/file/5c20ca4b0b20b0bd2f1d839dc605e70f-Paper-Conference.pdf) - A fast grammar engine for structured generation.\n- [Fairness in Serving Large Language Models](https://arxiv.org/html/2401.00588) - Fair scheduling when request sizes are different and unknown.\n\n### Long context and multimodal inference\n\n- [Ring Attention](https://arxiv.org/abs/2310.01889) - Exact distributed attention by circulating KV blocks around a device ring.\n- [MInference 1.0](https://arxiv.org/abs/2407.02490) - Dynamic sparse patterns for long-context prefill on existing models.\n- [Native Sparse Attention](https://arxiv.org/abs/2502.11089) - A model trained with a hardware-aligned sparse attention hierarchy.\n- [vLLM multimodal inputs](https://docs.vllm.ai/en/latest/features/multimodal_inputs.html) - Current engine support for text, image, audio, and video inputs.\n\n## 5. Distributed inference\n\n### Parallelism, collectives, and topology\n\n- [Megatron-LM](https://arxiv.org/abs/1909.08053) - Tensor and pipeline parallelism for transformer models.\n- [NCCL](https://github.com/NVIDIA/nccl) - NVIDIA's collective communication implementation.\n- [Multi-node NVLink Systems Tuning Guide](https://docs.nvidia.com/multi-node-nvlink-systems/multi-node-tuning-guide/) - NVLink and InfiniBand topology in GB200 NVL systems.\n- [UALink 1.0 Specification](https://ualinkconsortium.org/wp-content/uploads/2025/04/UALink200_Specification_v1.0_Evaluation_Copy.pdf) - An open scale-up interconnect.\n- [Ultra Ethernet 1.0.3 Specification](https://ultraethernet.org/wp-content/uploads/sites/20/2026/08/UE-Specification-1.0.3.pdf) - The scale-out transport specification.\n\n### Mixture-of-experts serving\n\n- [DeepSeek-V3](https://arxiv.org/html/2412.19437) - Routed experts, shared experts, and the model-system design.\n- [DeepEP](https://github.com/deepseek-ai/DeepEP) - Expert dispatch and combine kernels.\n- [EPLB](https://github.com/deepseek-ai/EPLB) - Expert placement and replication from measured load.\n- [MegaScale-Infer](https://arxiv.org/abs/2504.02263) - Large-scale MoE inference and communication overlap.\n\n### Prefill and decode disaggregation\n\n- [DistServe](https://arxiv.org/html/2401.09670) - Separate prefill and decode workers optimized for goodput under latency constraints.\n- [Splitwise](https://www.microsoft.com/en-us/research/publication/splitwise-efficient-generative-llm-inference-using-phase-splitting/) - Phase-specific allocation and scheduling.\n- [Mooncake](https://www.usenix.org/conference/fast25/presentation/qin) - KV-centric disaggregated inference.\n- [NIXL](https://github.com/ai-dynamo/nixl) - A transport layer for moving inference state across memory and network backends.\n- [Dynamo disaggregated serving](https://docs.nvidia.com/dynamo/design-docs/disaggregated-serving.md) - A current production implementation.\n\n### Production systems\n\n- [Clockwork](https://www.usenix.org/conference/osdi20/presentation/gujarati) - Predictable model serving through centralized scheduling.\n- [ServerlessLLM](https://www.usenix.org/conference/osdi24/presentation/fu) - Faster model startup and live migration.\n- [Gateway API Inference Extension](https://gateway-api-inference-extension.sigs.k8s.io/) - Model, accelerator, and KV-aware request routing.\n- [llm-d](https://github.com/llm-d/llm-d) - Distributed routing, scheduling, and disaggregated serving on Kubernetes.\n\n### Serving benchmarks\n\n- [MLPerf Inference](https://www.cs.toronto.edu/ecosystem/papers/ISCA_20/MLPerf%20Inference.pdf) - Reproducible benchmark scenarios and load generation.\n- [Etalon](https://arxiv.org/html/2407.07000) - Goodput under per-request latency SLOs.\n- [ServeGen](https://www.usenix.org/system/files/nsdi26-xiang-servegen.pdf) - Workload generation that preserves important production-trace properties.\n- [BurstGPT](https://github.com/HPMLL/BurstGPT) - A public trace for bursty LLM workloads.\n- [MLPerf Endpoints](https://mlcommons.org/benchmarks/endpoints/) - An endpoint-level benchmark for interactive generative AI.\n\n## 6. Current hardware\n\nRead each architecture with its ISA or tuning guide. Vendor peak numbers are not performance measurements.\n\n### NVIDIA\n\n- [Blackwell architecture brief](https://resources.nvidia.com/en-us-blackwell-architecture/blackwell-architecture-technical-brief) - Blackwell and Blackwell Ultra system architecture.\n- [Blackwell Tuning Guide](https://docs.nvidia.com/cuda/blackwell-tuning-guide/) - Programming and optimization guidance.\n- [CUTLASS Blackwell documentation](https://docs.nvidia.com/cutlass/latest/media/docs/cpp/blackwell.html) - Blackwell matrix multiply and data-movement support.\n\n### AMD\n\n- [CDNA 4 architecture whitepaper](https://www.amd.com/content/dam/amd/en/documents/instinct-tech-docs/white-papers/amd-cdna-4-architecture-whitepaper.pdf) - MI350 compute, memory, and chiplet architecture.\n- [CDNA 4 instruction set](https://www.amd.com/content/dam/amd/en/documents/instinct-tech-docs/instruction-set-architectures/amd-instinct-cdna4-instruction-set-architecture.pdf) - The native machine instruction reference.\n- [MI350 performance counters](https://rocm.docs.amd.com/en/latest/reference/gpu-arch/mi350-performance-counters.html) - Counter definitions and measurement guidance.\n\n### Google TPU\n\n- [TPU v1 analysis](https://research.google/pubs/in-datacenter-performance-analysis-of-a-tensor-processing-unit/) - The original datacenter TPU paper.\n- [TPU v4](https://arxiv.org/abs/2304.01433) - The TPU v4 chip, interconnect, and system.\n- [Ironwood documentation](https://docs.cloud.google.com/tpu/docs/tpu7x) - Current TPU v7 architecture and configuration.\n- [Pallas TPU hardware model](https://docs.jax.dev/en/latest/pallas/tpu/hardware.html) - The TPU execution and memory model for kernel authors.\n\n### AWS Trainium\n\n- [Trainium and Inferentia2 architecture](https://awsdocs-neuron.readthedocs-hosted.com/en/latest/nki/guides/architecture/trainium_inferentia2_arch.html) - NeuronCore v2 compute and memory architecture.\n- [Trainium3 architecture](https://awsdocs-neuron.readthedocs-hosted.com/en/latest/nki/guides/architecture/trainium3_arch.html) - The current NeuronCore architecture.\n- [NKI performance guide](https://awsdocs-neuron.readthedocs-hosted.com/en/v2.24.0/general/nki/nki_perf_guide.html) - Kernel optimization for Trainium and Inferentia.\n\n## Frontier\n\nVerified on **2026-08-23**. This section is kept separate from the core list because the evidence changes quickly.\n\n### AI-generated kernels\n\n- [KernelBench](https://proceedings.mlr.press/v267/ouyang25a.html) - The original benchmark for converting PyTorch operators into faster GPU kernels.\n- [KernelBench-Verified](https://arxiv.org/html/2607.16241) - Stronger correctness tests and baseline parity.\n- [SOL-ExecBench](https://github.com/nvidia/sol-execbench) - Correctness and performance measured against a hardware speed-of-light model.\n\n### Watchlist\n\n- [NVIDIA Rubin](https://developer.nvidia.com/blog/inside-nvidia-rubin-gpu-architecture-powering-the-era-of-agentic-ai/) and Rubin CPX, pending shipped systems and reproducible measurements.\n- AMD MI400, CDNA 5, and Helios, pending architecture and ISA documents.\n- Session-aware and agentic scheduling against public production traces.\n- Real-time voice and video serving with complete quality and latency metrics.\n- Inference ASICs, processing in memory, analog compute, and photonic compute with reproducible deployments.\n- Individual AI kernel agents that have not been rerun on a hardened evaluator.\n\n## Source policy\n\nA core source must be one of the following:\n\n- the paper that introduced the mechanism;\n- the specification or official documentation that defines it;\n- the repository that implements it;\n- a direct implementer report with code, measurements, and enough detail to reproduce the result.\n\nPerformance claims need the hardware, workload, precision, baseline, and correctness method. Otherwise the number is omitted.\n\nSee [CONTRIBUTING.md](CONTRIBUTING.md) before proposing a resource.\n\n## License\n\nMIT\n\n## Maintainer\n\nemilio@wafer.ai\n", "auditDate": "2 October 2026", "auditReportDataUrl": "data:text/html;charset=utf-8;base64,PCFkb2N0eXBlIGh0bWw+PGh0bWwgbGFuZz0iZW4iPjxtZXRhIGNoYXJzZXQ9InV0Zi04Ij48bWV0YSBuYW1lPSJ2aWV3cG9ydCIgY29udGVudD0id2lkdGg9ZGV2aWNlLXdpZHRoLGluaXRpYWwtc2NhbGU9MSI+PHRpdGxlPkdQVSBGaWVsZGJvb2sg4oCUIFZlcmlmaWNhdGlvbiByZXBvcnQ8L3RpdGxlPjxzdHlsZT5ib2R5e21heC13aWR0aDoxMTgwcHg7bWFyZ2luOjUwcHggYXV0bztwYWRkaW5nOjAgMjVweDtmb250OjE2cHgvMS42NSBzeXN0ZW0tdWksc2Fucy1zZXJpZjtjb2xvcjojMTcyMTJlO2JhY2tncm91bmQ6I2ZmZn1oMSxoMntmb250LWZhbWlseTpHZW9yZ2lhLHNlcmlmfWgxe2ZvbnQtc2l6ZTo0NHB4O2xpbmUtaGVpZ2h0OjEuMX1oMnttYXJnaW4tdG9wOjQ1cHh9YXtjb2xvcjojMjM1OTMyO3RleHQtdW5kZXJsaW5lLW9mZnNldDozcHh9c21hbGx7ZGlzcGxheTpibG9jaztjb2xvcjojNjY3MTdjO21hcmdpbi10b3A6NXB4fS5sZWFke2ZvbnQtc2l6ZToyMHB4fS5ub3Rle2JhY2tncm91bmQ6I2YwZjVlZDtib3JkZXItbGVmdDozcHggc29saWQgIzcyYTM0NTtwYWRkaW5nOjIwcHh9LnRhYmxlLXdyYXB7b3ZlcmZsb3c6YXV0b310YWJsZXtib3JkZXItY29sbGFwc2U6Y29sbGFwc2U7d2lkdGg6MTAwJTtmb250LXNpemU6MTRweH10ZCx0aHt0ZXh0LWFsaWduOmxlZnQ7cGFkZGluZzoxNXB4IDEwcHg7Ym9yZGVyLWJvdHRvbToxcHggc29saWQgI2RjZTJlODt2ZXJ0aWNhbC1hbGlnbjp0b3B9dGQ6Zmlyc3QtY2hpbGR7d2hpdGUtc3BhY2U6bm93cmFwfWxpe21hcmdpbjoxNXB4IDB9Y29kZXtvdmVyZmxvdy13cmFwOmFueXdoZXJlfW5hdntkaXNwbGF5OmZsZXg7Z2FwOjIwcHg7ZmxleC13cmFwOndyYXB9ZGV0YWlsc3ttYXJnaW46MjVweCAwfXN1bW1hcnl7Y3Vyc29yOnBvaW50ZXI7Zm9udC13ZWlnaHQ6NjAwfUBtZWRpYSBwcmludHtib2R5e21hcmdpbjowO2ZvbnQtc2l6ZToxMXB0fXRhYmxle2ZvbnQtc2l6ZTo5cHR9dHJ7YnJlYWstaW5zaWRlOmF2b2lkfX08L3N0eWxlPjxib2R5PjxwPkdQVSBQRVJGT1JNQU5DRSBGSUVMREJPT0sgwrcgQVVESVQgwrcgMiBPQ1RPQkVSIDIwMjY8L3A+PGgxPlZlcmlmaWNhdGlvbiByZXBvcnQ8L const models = {
  roofline: intensity => Math.min(1000, 2 * intensity),
  kvBytes: (batch, tokens, layers, heads, dimension, bytes) => 2 * batch * tokens * layers * heads * dimension * bytes,
  amdahl: (workers, serialFraction) => 1 / (serialFraction + (1 - serialFraction) / workers),
  memory: stride => {const indices=Array.from({length:8},(_,i)=>i*stride);return {indices,sectors:new Set(indices.map(i=>Math.floor(i/8))).size}},
  formatBytes: bytes => bytes < .01 * 2**30 ? `${(bytes/2**20).toFixed(2)} MiB` : `${(bytes/2**30).toFixed(2)} GiB`
};

const DATA=JSON.parse(document.getElementById('book-data').textContent),CH=DATA.chapters,$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={done:[],theme:'light',large:false};try{const saved=JSON.parse(localStorage.getItem('gpu-fieldbook-v1')||'{}');state={...state,...saved};state.done=Array.isArray(state.done)?[...new Set(state.done.filter(i=>Number.isInteger(i)&&i>=0&&i<8))]:[]}catch(e){}try{const theme=localStorage.getItem('voidwest-theme');if(theme==='light'||theme==='dark')state.theme=theme}catch(e){}let current=0;
const save=()=>{try{localStorage.setItem('gpu-fieldbook-v1',JSON.stringify(state))}catch(e){}};
function prefs(){document.documentElement.dataset.theme=state.theme;document.body.classList.toggle('dark',state.theme==='dark');document.documentElement.style.setProperty('--body-size',state.large?'19px':'17px');$('#theme').setAttribute('aria-label',`Switch to ${state.theme==='dark'?'light':'dark'} theme`);$('#font').textContent=state.large?'Aa −':'Aa +';$('#font').setAttribute('aria-label',state.large?'Use standard text size':'Increase reading text size')}prefs();
function nav(){ $('#chapters').innerHTML=CH.map((c,i)=>`<a href="#chapter-${i}" class="${i===current?'active':''}" ${i===current?'aria-current="page"':''}><span class="num">${String(i).padStart(2,'0')}</span><span>${esc(c.title)}</span>${state.done.includes(i)?'<span class="tick" aria-label="Completed">✓</span>':''}</a>`).join('');$('#progress-label').textContent=`${state.done.length} of 8 chapters completed`;$('#book-progress').style.width=state.done.length/8*100+'%'}
function citations(items){return `<div class="citations">Sources: ${items.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(' · ')}</div>`}
function labShell(title,body){return `<section class="lab" id="interactive"><div class="lab-top"><span>Interactive notebook</span><span class="tag">Try it yourself</span></div><h3>${title}</h3>${body}${citations(CH[current].labSources)}</section>`}
