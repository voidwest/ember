[package]
name = "ember-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Python bindings for Ember's investigate surface (inspect/diff reports)"
publish = false

[lib]
name = "ember_python"
crate-type = ["cdylib"]

[dependencies]
# Headless core only: the gui/audio features must never enter a Python wheel.
ember = { path = "../..", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
anyhow = "1"
serde_json = "1"
