[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "ember-py"
dynamic = ["version"]
description = "Python bindings for Ember's investigate surface (inspect/diff reports)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.maturin]
module-name = "ember"
